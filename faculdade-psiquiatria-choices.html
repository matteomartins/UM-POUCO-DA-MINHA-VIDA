<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choices de Psiquiatría</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a24; --muted:#66716a; --line:#e2ded4;
  --accent:#1f5c47; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --ok:#1d7a46; --ok-bg:#e1f3e8; --bad:#b3372e; --bad-bg:#fbe7e4; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --card:#1d2621; --ink:#e8efe9; --muted:#9aa89f; --line:#2f3b34;
    --accent:#5fb995; --accent-ink:#0f1a15; --accent-soft:#233a2f;
    --ok:#6fd49a; --ok-bg:#1c3a2a; --bad:#f08a80; --bad-bg:#40211e; --warn-bg:#3a3217;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --card:#1d2621; --ink:#e8efe9; --muted:#9aa89f; --line:#2f3b34;
  --accent:#5fb995; --accent-ink:#0f1a15; --accent-soft:#233a2f;
  --ok:#6fd49a; --ok-bg:#1c3a2a; --bad:#f08a80; --bad-bg:#40211e; --warn-bg:#3a3217; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;margin:.2rem 0 .1rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.topic{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer}
.topic input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.topic.on{border-color:var(--accent);background:var(--accent-soft)}
.topic b{display:block;font-size:.95rem;line-height:1.25}
.topic small{color:var(--muted)}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--accent);width:18px;height:18px}
.hint{color:var(--muted);font-size:.9rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;margin:8px 0 14px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:600;margin-bottom:10px}
.q{font-size:1.12rem;font-weight:600;margin:0 0 14px;line-height:1.4}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);line-height:1.4}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .k{background:var(--ok);color:#fff}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.choice.bad .k{background:var(--bad);color:#fff}
.choice:disabled{opacity:1;cursor:default;color:var(--ink)}
.choice.dim{opacity:.6}
.feedback{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--warn-bg)}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok)}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad)}
.feedback h3{margin:0 0 6px;font-size:1rem}
.feedback p{margin:0}
.feedback .src{margin-top:8px;font-size:.85rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{font-size:3rem;font-weight:800;letter-spacing:-.02em;margin:.2rem 0}
.tb{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:10px 0}
.tb .bar{grid-column:1/-1}
.tb span{font-size:.92rem}
.hide{display:none!important}
.theme{position:fixed;top:10px;right:10px;padding:6px 10px;font-size:.85rem}
@media (max-width:480px){.wrap{padding:16px 12px 48px}.card{padding:14px}.q{font-size:1.05rem}}
</style>
</head>
<body>
<button class="theme ghost" id="theme" aria-label="Alternar tema claro/oscuro">☾</button>
<div class="wrap">

<section id="home">
  <h1>Choices de Psiquiatría</h1>
  <p class="sub">Práctica de múltiple opción basada en el apunte (13 temas). Elegí temas, respondé y leé la justificación.</p>
  <div class="card">
    <div class="row spread">
      <b>Temas</b>
      <span class="row"><button class="ghost" id="allOn">Todos</button><button class="ghost" id="allOff">Ninguno</button></span>
    </div>
    <div class="topics" id="topics"></div>
    <div class="opts">
      <label><input type="radio" name="mode" value="all" checked> Todas</label>
      <label><input type="radio" name="mode" value="todo"> Solo las que aún no respondí</label>
      <label><input type="radio" name="mode" value="wrong"> Solo las que erré</label>
    </div>
    <div class="opts" role="radiogroup" aria-label="Prioridad">
      <b>Prioridad:</b>
      <label><input type="radio" name="prio" value="core" checked> Esencial + importante</label>
      <label><input type="radio" name="prio" value="top"> Solo esencial</label>
      <label><input type="radio" name="prio" value="all"> Todo, incluidos detalles</label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="shuf" checked> Orden aleatorio</label>
    </div>
    <div class="row spread">
      <span class="hint" id="sel"></span>
      <button class="primary" id="start">Empezar</button>
    </div>
  </div>
  <p class="hint" style="margin-top:14px">Tu progreso se sincroniza en la nube entre tus dispositivos. <span id="sync"></span> <button class="ghost" id="reset" style="padding:4px 8px;font-size:.85rem">Borrar progreso</button></p>
</section>

<section id="quiz" class="hide">
  <div class="row spread">
    <button class="ghost" id="quit">← Salir</button>
    <span class="hint" id="liveScore"></span>
  </div>
  <div class="meta"><span id="pos"></span><span id="topicName"></span></div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div class="card" style="margin-top:14px">
    <span class="tag" id="tag"></span>
    <p class="q" id="qtext"></p>
    <div id="choices"></div>
    <div id="fb" class="feedback hide" role="status" aria-live="polite"></div>
    <div class="nav">
      <span class="hint">Atajos: A–D o 1–4 para responder, Enter para seguir</span>
      <button class="primary hide" id="next">Siguiente →</button>
    </div>
  </div>
</section>

<section id="result" class="hide">
  <h1>Resultado</h1>
  <div class="card">
    <div class="score" id="rScore"></div>
    <p class="sub" id="rMsg"></p>
    <div id="rTopics"></div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="redo">Repetir las que erré</button>
      <button id="home2">Volver al inicio</button>
    </div>
  </div>
</section>

</div>

<script>
const QS=[];
QS.push(...[["0.1", "¿Qué autor de la bibliografía de Psicosemiología escribió «Curso de Semiología Psiquiátrica»?", "Hugo Marietan", "Carlos R. Pereyra", "Juan C. Betta", "Mateo S. Denegri", "Pereyra: «Semiología y psicopatología de los procesos de la esfera intelectual». Betta: «Manual de Psiquiatría».", 3], ["0.2", "¿Cuáles son los tres planos de observación del examen inicial?", "Aspecto, actitud y conducta en la entrevista", "Conciencia, orientación y atención del paciente", "Pensamiento, lenguaje y juicio de realidad", "Afecto, voluntad y psicomotricidad general", "El examen mental empieza por la observación del paciente.", 2], ["0.2", "«Colaborador, reticente, suspicaz, hostil, demandante» describe:", "La actitud del paciente", "Su aspecto", "Su orientación", "Su estado de conciencia", "Aspecto: higiene, vestimenta, características físicas.", 2], ["0.2", "«Tranquilo, inquieto, contacto visual, desorganizado, ansioso, irritable» describe:", "Conducta durante la entrevista", "Actitud ante el examinador", "Aspecto físico del paciente", "Estado de orientación", "Son los ejemplos de la diapositiva.", 2], ["0.3", "¿En qué tres grupos se ordenan las funciones psíquicas?", "Cognitiva, afectiva y volitiva", "Básicas, superiores y vegetativas", "Conciencia, atención y memoria", "Pensamiento, lenguaje y juicio", "La cognitiva se divide en FIB y FIS.", 2], ["0.3", "¿Cuáles son las funciones intelectuales básicas (FIB)?", "Atención, sensopercepción y memoria", "Pensamiento, imaginación y juicio", "Atención, pensamiento y memoria", "Sensopercepción, imaginación y juicio", "Las FIS son pensamiento, imaginación y juicio.", 2], ["0.3", "¿Cuáles son las funciones intelectuales superiores (FIS)?", "Pensamiento, imaginación y juicio", "Atención, sensopercepción y memoria", "Pensamiento, memoria y juicio", "Imaginación, atención y juicio", "Las FIB son atención, sensopercepción y memoria.", 2], ["0.4", "¿Cuál es el orden de los niveles de conciencia, de mayor a menor?", "Vigilia, letargo/somnolencia, obnubilación, estupor y coma", "Vigilia, estupor, obnubilación, letargo y coma", "Coma, estupor, obnubilación, letargo y vigilia", "Vigilia, obnubilación, letargo, coma y estupor", "La diapositiva lo muestra como una flecha descendente.", 2], ["0.4", "¿Qué es la claridad de la conciencia?", "Atención más percepción", "Atención más percepción más memoria", "Percepción más memoria", "Atención más pensamiento", "Lucidez = atención + percepción + memoria.", 2], ["0.4", "¿De qué depende la lucidez?", "Del estado de las FIB", "Del estado de las FIS", "Solo del nivel de atención", "Del estado afectivo", "Lucidez = atención + percepción + memoria.", 2], ["0.4", "Paciente vigil, pero que no sabe en qué lugar está ni qué día es. ¿Qué alteración describe?", "Desorientación alopsíquica en espacio y tiempo", "Desorientación autopsíquica en la persona", "Alteración del juicio de realidad", "Obnubilación de la conciencia", "La orientación en persona es la autopsíquica.", 1], ["0.5", "La orientación en espacio y tiempo se llama:", "Alopsíquica", "Autopsíquica", "Somatopsíquica", "Mesopsíquica", "La orientación en persona es la autopsíquica.", 2], ["0.5", "¿Qué función depende de cada componente de la orientación en el tiempo?", "Día o noche depende de la conciencia; la fecha, de la memoria", "Día o noche depende de la memoria; la fecha, de la conciencia", "Ambos dependen exclusivamente de la atención", "Ambos dependen exclusivamente del lóbulo parietal", "La orientación en el espacio se asocia al lóbulo parietal.", 2], ["0.5", "¿Con qué estructura se asocia la orientación en el espacio?", "El lóbulo parietal", "El lóbulo frontal", "El lóbulo occipital", "El cerebelo", "Entorno, lugar, espacio.", 2], ["0.6", "La atención (prosexia) depende de:", "El SRA y el lóbulo frontal", "El lóbulo parietal", "El lóbulo occipital", "El cerebelo", "Puede ser voluntaria (dirigida) o involuntaria (espontánea).", 2], ["0.6", "Hipoprosexia e hiperprosexia son alteraciones:", "Cuantitativas de la atención", "Cualitativas de la atención", "Cuantitativas de la memoria", "Cualitativas del pensamiento", "La alteración cualitativa de la atención es la paraprosexia.", 2], ["0.6", "¿Cómo se explora la atención según la diapositiva?", "Conversación, consignas y meses al revés", "Dibujos y pruebas proyectivas", "Electroencefalograma de reposo", "Test de personalidad escrito", "Son los tres métodos que muestra la diapositiva.", 2], ["0.7", "¿Cómo se ilustran las ilusiones en la diapositiva?", "Con una soga enrollada y una nube con forma de rostro", "Con una voz que repite el propio nombre en silencio", "Con una sombra que se mueve en la penumbra", "Con un espejo roto que deforma la imagen", "Son percepciones distorsionadas de algo real.", 2], ["0.7", "¿Cuáles son los tipos de alucinaciones que muestra el esquema?", "Auditivas, visuales y cenestésicas", "Solo auditivas y visuales", "Solo visuales y olfatorias", "Solo táctiles y gustativas", "También figuran pseudoalucinaciones y alucinosis.", 2], ["0.7", "Soliloquios, musitaciones y risas inmotivadas son:", "Conductas que acompañan a las alucinaciones", "Alteraciones de la memoria reciente", "Alteraciones del juicio de realidad", "Alteraciones de la orientación", "Son conductas observables.", 2], ["0.8", "La amnesia retrógrada se refiere a:", "El pasado", "El futuro", "El presente", "La orientación", "La anterógrada se refiere al futuro.", 2], ["0.8", "¿Cuáles son las alteraciones cuantitativas de la memoria?", "Hipomnesia y amnesia", "Fabulaciones y confabulaciones", "Paramnesias y olvido", "Hipomnesia y fabulación", "Cualitativas: fabulaciones y confabulaciones.", 2], ["0.9", "¿Cuál de estas es una alteración de la forma del pensamiento?", "Viscosidad, perseveración y disgregación del pensamiento", "Fuga de ideas y taquipsiquia del pensamiento", "Ideas obsesivas y deliroides del pensamiento", "Logorrea y taquilalia del lenguaje", "Ritmo: fuga de ideas, taquipsiquia, bradipsiquia.", 2], ["0.9", "¿Qué alteraciones del ritmo del pensamiento muestra la diapositiva?", "Fuga de ideas, taquipsiquia y bradipsiquia", "Viscosidad, perseveración y bloqueo", "Ideas obsesivas y sobrevaloradas", "Disgregación y neologismos", "Contenido: obsesivas, sobrevaloradas, deliroides y delirantes.", 2], ["0.9", "¿Cuáles son las alteraciones del contenido del pensamiento?", "Ideas obsesivas, sobrevaloradas, deliroides y delirantes", "Viscosidad, perseveración y disgregación", "Fuga de ideas, taquipsiquia y bradipsiquia", "Bloqueo e interceptación del pensamiento", "La idea delirante está resaltada en el esquema.", 2], ["0.10", "¿Cuáles son las características centrales de la idea delirante?", "Certeza absoluta e irreductibilidad frente a la evidencia", "Duda permanente con lucha interna del paciente", "Variabilidad diaria según el estado de ánimo", "Culpa y arrepentimiento ante la crítica", "Puede ser verosímil o inverosímil, sistematizada o polimorfa.", 2], ["0.10", "¿Qué dos tipos agrupa el delirio paranoide en el esquema?", "Persecutorio y de perjuicio", "Celotípico y erotomaníaco", "Místico y de culpa", "De ruina y de influencia", "Otros tipos: megalómano, ruina, culpa, influencia, referencia, místico, hipocondríaco, celotípico y erotomaníaco.", 1], ["0.11", "¿Qué alteración del lenguaje corresponde a la articulación?", "Disartria", "Afasia", "Mutismo", "Neologismos", "Fluencia/producción: afasias. Emisión: mutismo.", 2], ["0.11", "Logorrea o verborragia es una alteración de:", "La cantidad del lenguaje, aumentada en exceso", "El ritmo del lenguaje, acelerado o enlentecido", "La articulación de las palabras al hablar", "La creación de palabras nuevas con sentido propio", "Ritmo: taquilalia/bradilalia. Creación: neologismos.", 2], ["0.11", "Ecolalia y verbigeración son alteraciones de:", "La repetición", "La creación", "La emisión", "La fluencia", "Neologismos son alteraciones de la creación.", 2], ["0.12", "¿Qué contenido tiene la diapositiva de imaginación?", "Solo el título, sin contenido para estudiar", "Un esquema completo con definiciones", "Una tabla con las alteraciones principales", "Una lista de síntomas con ejemplos clínicos", "No hay material para esta función en la clase.", 3], ["0.13", "¿Cuál NO es una forma de juicio alterado según la diapositiva?", "Conservado", "Desviado", "Suspendido", "Insuficientemente desarrollado", "Alterado: desviado, deteriorado/debilitado, suspendido o insuficientemente desarrollado.", 2], ["0.13", "¿Qué contrapone la diapositiva de juicio?", "Conciencia de enfermedad (insight) frente a conciencia de situación", "Memoria inmediata frente a memoria remota", "Afecto frente a voluntad de acción", "Orientación frente a lucidez de la conciencia", "Sin definirlas.", 2], ["0.14", "Hipertimia e hipotimia se representan con:", "Un termómetro", "Una balanza", "Un velocímetro", "Una flecha", "La hipertimia puede ser placentera o displacentera.", 2], ["0.14", "¿Cuál de estas es una alteración cualitativa del afecto?", "Indiferencia, ambivalencia y labilidad afectiva", "Hipertimia e hipotimia del estado de ánimo", "Hipobulia e hiperbulia de la voluntad", "Hipercinesia e hipocinesia de la motricidad", "Las cuantitativas son hipertimia e hipotimia.", 2], ["0.15", "¿Cómo se llama la disminución de la voluntad?", "Hipobulia o abulia, función volitiva disminuida", "Hiperbulia, función volitiva aumentada", "Hipotimia, afecto disminuido", "Acinesia, ausencia de movimiento", "Aumentada: hiperbulia.", 2], ["0.16", "¿Cuáles son las alteraciones cuantitativas de la psicomotricidad?", "Hipercinesia, hipocinesia y acinesia", "Manierismos y estereotipias", "Catalepsia y negativismo", "Perseveración y ecopraxia", "Las cualitativas son diez (perseveración, manierismos, etc.).", 2], ["0.16", "¿Cuál de estos términos está entre las alteraciones cualitativas de la psicomotricidad?", "Catalepsia y obediencia automática", "Hipercinesia y agitación psicomotriz", "Hipocinesia e inhibición motora", "Acinesia y enlentecimiento marcado", "Más perseveración, manierismos, estereotipias, ecopraxia e interceptación cinética.", 2], ["0.17", "¿Cuáles son las tres funciones vegetativas de la diapositiva?", "Sueño, alimentación (orexia) y sexualidad", "Conciencia, atención y memoria", "Afecto, voluntad y juicio", "Lenguaje, pensamiento y orientación", "Alteraciones que figuran: insomnio, hiperorexia, anorexia.", 2], ["1.1", "¿Cuál es el eje que ordena el diagnóstico de cualquier trastorno de ansiedad según la clase?", "La preocupación excesiva", "La inquietud motora", "La aceleración del pensamiento", "La impaciencia con el entorno", "El apunte aclara que una persona inquieta, acelerada o impaciente, sin preocupación excesiva de base, no tiene necesariamente un trastorno de ansiedad. El criterio central es la preocupación excesiva.", 1], ["1.2", "El trastorno de ansiedad por separación se vuelve patológico cuando:", "El miedo se replica con intensidad más allá de lo esperable para la edad", "El miedo aparece por primera vez alrededor de los 7-8 meses de vida", "El niño llora al separarse de cualquier persona desconocida", "El niño se niega a hablar con una persona o en un lugar puntual", "Alrededor de los 7-8 meses es una fase normal del desarrollo (el niño toma conciencia de ser distinto del entorno). Se vuelve patológico si se replica con intensidad más allá de lo esperable para la edad.", 2], ["1.2", "¿Cuál es el tratamiento de los trastornos de ansiedad de inicio temprano (separación y mutismo selectivo)?", "Solo psicoterapia", "Un IRS desde el inicio", "Benzodiazepinas a dosis bajas", "Antidepresivos tricíclicos", "Los trastornos de inicio temprano (niñez) se tratan solo con psicoterapia, sin fármacos.", 1], ["1.2", "¿Qué define al mutismo selectivo?", "Imposibilidad de hablar ante una persona o situación puntual", "Negativa voluntaria a hablar en todos los contextos por oposicionismo", "Miedo intenso a ser humillado cuando debe hablar en público", "Retraso del lenguaje con habla pobre en cualquier contexto", "Es la imposibilidad, no la elección, de hablar ante una persona o situación puntual (un docente, un familiar). Previamente se descartan abuso o violencia.", 2], ["1.2", "¿Cuál de estas afirmaciones sobre la fobia específica es correcta?", "El miedo puede dispararse con la sola representación del objeto", "Requiere siempre tratamiento con IRS desde el inicio", "Se define por miedo a los espacios abiertos", "Genera deterioro del funcionamiento aun lejos del estímulo temido", "Es un miedo concreto e intenso a un objeto o situación (alturas, volar, arañas) que se dispara aun con la representación. Fuera de la exposición al estímulo la persona funciona normalmente. Se trata con psicoterapia, generalmente sin fármacos.", 2], ["1.2", "La agorafobia es el miedo a:", "Los espacios abiertos", "Los espacios cerrados o estrechos", "Salir de casa, como se cree popularmente", "Ser humillado en público", "La agorafobia es miedo a los espacios ABIERTOS (no «miedo a salir de casa»). Se contrapone a la claustrofobia (espacios cerrados), relevante por ejemplo para la resonancia magnética.", 2], ["1.2", "Un paciente no levanta la mano en clase, no va a un karaoke y busca pasar inadvertido por temor al juicio ajeno. ¿Qué cuadro tiene?", "Trastorno de ansiedad social", "Fobia específica a un objeto", "Agorafobia", "Mutismo selectivo", "En la ansiedad social el miedo central es hacer el ridículo o ser humillado en público; evita exponerse por temor al juicio ajeno, no por simple timidez.", 1], ["1.2", "¿Qué se descarta previamente ante un cuadro de mutismo selectivo?", "Abuso o violencia", "Hipoacusia congénita", "Esquizofrenia de inicio temprano", "Trastorno bipolar infantil", "El mutismo selectivo es la imposibilidad de hablar ante una persona o situación puntual; antes de diagnosticarlo se descartan abuso o violencia.", 3], ["1.2", "¿Cuál de estos trastornos de ansiedad requiere tratamiento farmacológico?", "Trastorno de ansiedad social", "Trastorno de ansiedad por separación", "Mutismo selectivo", "Fobia específica", "Los de inicio temprano y la fobia específica se tratan con psicoterapia. Requieren fármacos: agorafobia, pánico, TAG y ansiedad social.", 1], ["1.2", "¿Cuál es el tratamiento habitual de la fobia específica?", "Psicoterapia, generalmente sin fármacos", "IRS a dosis altas desde el inicio", "Benzodiazepinas de forma sostenida", "Antipsicóticos atípicos", "La fobia específica (alturas, volar, oscuridad, arañas, serpientes) se trata con psicoterapia, generalmente sin fármacos.", 1], ["1.2", "¿Por qué la claustrofobia es relevante en la práctica clínica?", "Dificulta estudios como la resonancia magnética", "Impide tomar medicación por vía oral", "Contraindica la anestesia general", "Impide realizar un electrocardiograma", "La claustrofobia es el miedo a espacios cerrados o estrechos, a diferencia de la agorafobia (espacios abiertos).", 2], ["1.2", "¿Qué distingue la ansiedad social de la simple timidez?", "Evita exponerse por temor al juicio ajeno y a la humillación", "Es solo reservado y no siente ningún miedo", "Evita únicamente a las personas que conoce", "Se expone sin problemas pero habla poco", "Evita levantar la mano, ir a un karaoke, y busca pasar inadvertido.", 2], ["1.3", "¿Qué diferencia un trastorno de pánico de un ataque de pánico aislado?", "Tras los ataques, la persona evita lugares o situaciones", "El trastorno tiene más síntomas físicos que el ataque aislado", "El ataque aislado dura más que los ataques del trastorno", "Un ataque aislado siempre deja secuelas conductuales", "Un ataque aislado le puede pasar a cualquiera y pasa sin secuelas. El trastorno aparece cuando hay evitación conductual (ej. deja de tomar el subte y camina 20 cuadras).", 1], ["1.3", "Un paciente llega a guardia convencido de que tiene un infarto, con parestesias en el miembro superior izquierdo y opresión precordial, y el ECG es normal. Para el episodio agudo de pánico, el manejo habitual es:", "Benzodiazepinas (clonazepam) y derivación a salud mental", "Un antidepresivo como única medida desde la guardia", "Un antipsicótico atípico a dosis bajas", "Psicoterapia sola, sin ningún fármaco", "La crisis aguda se trata con benzodiazepina; el trastorno de pánico (con evitación conductual) se trata con antidepresivos.", 1], ["1.3", "¿Cuál de estas manifestaciones NO corresponde a un ataque de pánico?", "Alucinaciones auditivas de comando", "Sensación de muerte inminente", "Parestesias en miembro superior izquierdo", "Sensación de «volverse loco»", "El ataque de pánico incluye muerte inminente, asfixia, opresión torácica, parestesias del miembro superior izquierdo, taquicardia, taquipnea, HTA transitoria y pérdida de control.", 2], ["1.3", "Una persona deja de tomar el subte y camina 20 cuadras; luego evita también el colectivo por asociarlo con el túnel del subte. ¿Qué ilustra?", "La evitación conductual propia del trastorno de pánico", "Una agorafobia pura sin ataques previos", "Una fobia específica a los túneles", "Un ataque de pánico aislado sin secuelas", "La evitación progresiva tras los ataques es lo que convierte un ataque aislado en trastorno de pánico.", 1], ["1.3", "¿Cómo se trata el trastorno de pánico ya instalado, con evitación conductual?", "Con antidepresivos", "Con benzodiazepinas únicamente", "Con antipsicóticos", "Solo con observación", "La crisis aguda se trata con benzodiazepina; el trastorno de pánico (con evitación) se trata con antidepresivos.", 2], ["1.3", "¿Qué se espera de un paciente con ataque de pánico que consulta en guardia creyendo tener un infarto?", "ECG normal", "ECG con supradesnivel del ST", "Troponina elevada", "Hipotensión sostenida", "Típicamente consulta por la opresión precordial y las parestesias del brazo izquierdo, que simulan un infarto, pero el ECG es normal.", 1], ["1.3", "Mujer de 32 años con episodios de opresión precordial y parestesias en el brazo izquierdo, ECG normal. Evita el subte y camina 20 cuadras. ¿Qué cuadro tiene?", "Trastorno de pánico, tratado con antidepresivos", "Ataque de pánico aislado, sin tratamiento", "Cardiopatía isquémica estable en seguimiento", "Fobia específica a los túneles y al subte", "Evitación conductual tras los ataques. La crisis aguda se trata con benzodiazepina; el trastorno, con antidepresivos.", 1], ["1.4", "El criterio C del DSM para el TAG exige:", "3 o más síntomas de una lista de 6 posibles", "Al menos 1 síntoma de una lista de 6", "Los 6 síntomas presentes al mismo tiempo", "Alucinaciones asociadas a la preocupación", "El criterio C pide 3 o más de estos 6 síntomas: inquietud, fatigabilidad fácil, dificultad para concentrarse, irritabilidad, tensión muscular y alteraciones del sueño.", 2], ["1.4", "¿Por qué el TAG está subdiagnosticado y subtratado?", "Genera síntomas somáticos y el paciente pasa por otras especialidades", "No produce síntomas físicos, solo preocupación mental", "Los pacientes consultan directamente a psiquiatría", "Responde siempre a la primera consulta clínica", "El estado de alerta sostenido (cortisol crónico y redistribución del flujo) genera somatizaciones. El paciente pasa por gastroenterología, traumatología, etc. Si no responde pese a estudios y tratamiento correctos, hay que sospechar ansiedad de base y derivar.", 2], ["1.4", "¿Qué se plantea sobre la relación entre un TAG no tratado y las enfermedades neurodegenerativas?", "Puede adelantar la aparición clínica", "Causa directamente la enfermedad de Alzheimer", "Protege contra la neurodegeneración por el cortisol", "No tiene relación alguna con la neurodegeneración", "El apunte dice que el TAG no tratado actúa como gatillo ambiental que puede acelerar la aparición de Parkinson, Alzheimer o demencia frontotemporal en predispuestos, sin ser su causa.", 2], ["1.4", "¿Qué caracteriza la preocupación del TAG?", "Excesiva, difícil de controlar y cotidiana", "Limitada a un objeto concreto", "Aparece solo ante estímulos específicos", "Breve y de resolución espontánea", "Abarca trabajo, dinero, transporte, salud de terceros y noticias, y domina el estado basal de la persona.", 2], ["1.4", "¿Qué mecanismo explica las manifestaciones somáticas del TAG?", "Cortisol crónico y alerta sostenida", "Déficit de serotonina periférica", "Hipofunción tiroidea secundaria", "Exceso de dopamina mesolímbica", "Es el mismo mecanismo por el que, al terminar un deporte, el estrés «baja» y uno nota las ganas de orinar.", 2], ["1.4", "¿Por cuál de estas consultas puede circular un paciente con TAG sin diagnosticar?", "Reflujo, úlceras, colon irritable, constipación y contracturas", "Fracturas, luxaciones y esguinces repetidos", "Infecciones respiratorias de repetición", "Cefaleas con aura y fotofobia únicamente", "El paciente pasa por gastroenterología, traumatología, etc., sin llegar nunca a salud mental por cuenta propia.", 1], ["1.4", "Ante un paciente con cuadro clínico que no responde pese a estudios y tratamiento correctos, ¿qué debe sospechar cualquier especialista?", "Ansiedad de base: derivar vía médico de familia", "Simulación del paciente: darlo de alta", "Error de laboratorio: repetir estudios", "Cuadro psicótico oculto: internar", "Es el rol del médico de cualquier especialidad.", 1], ["1.4", "¿Cuál es la serie de riesgo si un TAG no se trata?", "Ansiedad → depresión → psicosis", "Ansiedad → manía → demencia", "Ansiedad → fobia → pánico", "Ansiedad → TOC → bipolar", "Un TAG no tratado puede ser la puerta a un episodio depresivo mayor, y este puede desencadenar un cuadro psicótico en predispuestos.", 2], ["1.4", "Paciente que consulta a gastroenterología por reflujo y colon irritable y a traumatología por contracturas, con preocupación diaria por trabajo, dinero y salud de otros. ¿Qué cuadro sospecha?", "Trastorno de ansiedad generalizada", "Trastorno de pánico con agorafobia", "Enfermedad psicosomática pura", "Hipocondría con búsqueda de información", "El TAG se manifiesta con síntomas somáticos y está subdiagnosticado. Hay que derivar.", 1], ["1.4", "Según los criterios DSM-5 del TAG vistos en clase, ¿cuánto deben prolongarse la ansiedad y la preocupación excesivas?", "Más de 6 meses", "Más de 1 mes", "Más de 3 meses", "Más de 2 años", "Criterio A: ansiedad y preocupación excesivas (expectación aprensiva) sobre una amplia gama de acontecimientos, que se prolongan más de 6 meses.", 1], ["1.4", "Criterio B del TAG en la diapositiva de la clase:", "La preocupación resulta difícil de controlar", "La preocupación se limita a un único tema", "La preocupación aparece solo ante estímulos concretos", "La preocupación cede al distraerse", "Los criterios van de la A a la F: A excesiva y > 6 meses; B difícil de controlar; C ≥ 3 síntomas; D alteración de la actividad global; E exclusión de sustancias o enfermedades; F exclusión de otros trastornos.", 1], ["1.4", "Una paciente con anorexia nerviosa tiene preocupación y ansiedad limitadas a su peso y a la comida. ¿Corresponde diagnosticar TAG?", "No: el foco se limita a los síntomas de otro trastorno (criterio F)", "Sí, porque cumple el criterio A de más de 6 meses", "Sí, si además tiene 3 síntomas del criterio C", "Solo si agrega un ataque de pánico", "El criterio F excluye el TAG cuando el foco de la ansiedad no va más allá de otro trastorno: de ansiedad, del espectro obsesivo compulsivo, TDC, TEPT, anorexia nerviosa, somatización, ansiedad por separación, esquizofrenia o trastorno delirante.", 1], ["1.4", "Un paciente tiene ansiedad excesiva que se explica por efectos fisiológicos directos de una sustancia. ¿Qué criterio del TAG no se cumple?", "El E: exclusión de efectos de sustancias o de enfermedades clínicas", "El B: preocupación difícil de controlar", "El C: presencia de 3 o más síntomas", "El A: duración mayor a 6 meses", "El criterio E exige excluir los efectos fisiológicos directos de una sustancia o de enfermedades clínicas.", 1], ["1.4", "¿Cuál de estos diagnósticos NO figura en la lista de exclusión del criterio F de la diapositiva?", "Trastorno bipolar", "TEPT", "Esquizofrenia", "Trastorno de somatización", "La lista de la diapositiva incluye otro trastorno de ansiedad, del espectro obsesivo compulsivo, TDC, TEPT, anorexia nerviosa, somatización, ansiedad por separación, esquizofrenia y trastorno delirante.", 2], ["1.5", "¿Qué estructuras le dicen a la amígdala «ya pasó el peligro, apagá la alarma»?", "Corteza del cíngulo anterior y corteza prefrontal", "Hipocampo y corteza occipital", "Hipotálamo y glándula hipófisis", "Ganglios basales y cerebelo", "La amígdala da la valencia afectiva a los estímulos; el cíngulo anterior y la corteza prefrontal la regulan.", 2], ["1.5", "¿Cuáles son los hallazgos de imagen que se describen en la neurobiología común de ansiedad y bipolar?", "Amígdala hipertrófica y menor volumen prefrontal y cingular", "Amígdala atrófica y mayor volumen prefrontal", "Hipocampo hipertrófico como único hallazgo", "Menor volumen cerebeloso y talámico", "La hiperactividad crónica agranda la amígdala y el daño neurodegenerativo (con gliosis) reduce el volumen prefrontal y del cíngulo anterior.", 2], ["1.5", "¿Cómo contribuye la hiperactividad amigdalina a la neurodegeneración, además del cortisol crónico?", "Desbalancea glutamato/GABA hacia la excitación", "Aumenta el GABA y produce una sedación neuronal sostenida", "Disminuye la liberación de glutamato en la corteza prefrontal", "Inhibe el eje hipotálamo-hipófiso-adrenal de forma crónica", "El segundo mecanismo es la excitotoxicidad por desbalance hacia glutamato. El primero es el cortisol crónico que atraviesa la BHE y se une a receptores de glucocorticoides.", 2], ["1.5", "¿Qué función cumple la amígdala?", "Da valencia afectiva a los estímulos", "Regula el ritmo sueño-vigilia", "Controla la memoria declarativa", "Coordina el movimiento fino", "Decide si algo es peligroso, agradable o indiferente, tanto por vía sensorial como por aferencias viscerales.", 2], ["1.5", "¿Qué efecto tiene el cortisol crónico sobre las neuronas?", "Retracción dendrítica y pérdida de sinapsis", "Más ramificaciones dendríticas", "Mielinización excesiva", "Proliferación de neuronas nuevas", "El cortisol atraviesa la BHE y se une a receptores de glucocorticoides en neuronas y astrocitos.", 2], ["1.5", "¿Qué ilustra la analogía de la «heladera desenchufada»?", "Un circuito sin flujo vuelve a funcionar al restaurarlo", "El cerebro se apaga por completo durante la ansiedad", "El daño neuronal es siempre irreversible", "El tratamiento solo sirve durante las crisis", "Restaurar el circuito con un tratamiento efectivo hace que el síntoma se restituya.", 3], ["1.6", "Según la clase, el efecto terapéutico verdadero de los antidepresivos es:", "Regular la expresión génica y reconstruir sinapsis", "Llenar de serotonina la sinapsis, de forma directa", "Bloquear de forma sostenida los receptores de dopamina", "Aumentar la transmisión GABAérgica amigdalina", "No es «llenar de serotonina»: es un efecto neurotrófico por regulación génica. Benzodiazepinas, antipsicóticos y estabilizadores del ánimo no tienen ese efecto.", 2], ["1.6", "¿Por qué las drogas psicodélicas (psilocibina, ketamina) pueden funcionar mejor en depresión resistente?", "Son liposolubles y llegan a receptores 5-HT2 intracitoplasmáticos", "Son hidrosolubles y actúan solo sobre receptores de membrana", "Aumentan la cantidad de receptores serotoninérgicos de membrana", "Actúan bloqueando la recaptación de serotonina en la sinapsis", "En el estrés crónico puede haber déficit de receptores serotoninérgicos de membrana. Al ser liposolubles llegan a los 5-HT2 intracitoplasmáticos y generan el mismo efecto neurotrófico.", 2], ["1.6", "¿Cuál de estos grupos tiene efecto neurotrófico comprobado?", "Los antidepresivos (IRS y otros)", "Las benzodiazepinas", "Los antipsicóticos", "Los estabilizadores del ánimo clásicos", "Benzodiazepinas, antipsicóticos y estabilizadores del ánimo no tienen este efecto neurotrófico según la clase.", 2], ["1.7", "¿Cuál es el tratamiento farmacológico de primera línea de los trastornos de ansiedad?", "IRS (ISRS); si no funcionan, IRSN", "Benzodiazepinas sostenidas", "Antidepresivos tricíclicos", "Pregabalina sola", "Primera línea: ISRS, luego IRSN. Pregabalina es coadyuvante; los tricíclicos son segunda línea.", 1], ["1.7", "¿Cuál es el uso correcto de las benzodiazepinas en ansiedad?", "Puente las primeras 2-4 semanas, a dosis bajas", "Tratamiento de fondo durante los 2 años del esquema", "Primera línea sostenida mientras se titula el IRS", "Nunca, ni siquiera como puente de corta duración", "Los IRS tardan ~3 semanas en actuar (regulación génica). La benzodiazepina cubre ese período; lo ideal es retirarla al primer mes de control.", 1], ["1.7", "¿Qué ventaja tienen los antidepresivos tricíclicos (ej. imipramina) sobre los IRS?", "No bajan la libido, lo que mejora la adherencia en jóvenes", "Actúan en la primera semana, antes que los IRS", "Tienen efecto neurotrófico y los IRS no", "Son más seguros que los IRS en sobredosis", "Los tricíclicos son segunda línea; su ventaja es que no producen caída de la libido, que con IRS puede llevar al abandono.", 2], ["1.7", "Un paciente lleva 6 meses con sertralina 50 mg sin mejorar. Según la «regla de oro» de la clase:", "Nunca estuvo en tratamiento: 50 mg es dosis de inicio", "Fracaso terapéutico: corresponde cambiar de grupo", "Corresponde pasar a benzodiazepinas sostenidas", "Es la dosis de tratamiento habitual en ansiedad", "Las dosis de inicio NO son dosis de tratamiento: sertralina 50 mg es el arranque y el tratamiento real está en 200 mg. No fue un fracaso terapéutico.", 1], ["1.7", "¿Cuánto debe durar el tratamiento de ansiedad según la evidencia presentada?", "2 años; extenderlo a 3 o 5 no cambia mucho la recaída", "6 meses exactos, sin excepciones posibles", "5 años como mínimo para reducir recaídas", "De por vida desde el primer día de tratamiento", "El porcentaje de recaída baja con el tiempo y es bajo a los 2 años. Si reaparecen síntomas se reinicia, y puede sostenerse de por vida porque no hay evidencia de daño orgánico por uso crónico de IRS.", 1], ["1.7", "¿Cuál es el fármaco coadyuvante en el tratamiento de la ansiedad?", "Pregabalina", "Imipramina", "Clonazepam", "Quetiapina", "Primera línea ISRS, luego IRSN; la pregabalina es coadyuvante.", 1], ["1.7", "¿Por qué las benzodiazepinas se usan solo como puente?", "Los IRS tardan ~3 semanas en actuar, por regulación génica", "Los IRS actúan en 24 horas y las benzodiazepinas sobran", "Las benzodiazepinas son neurotróficas y se acumulan", "Las benzodiazepinas están contraindicadas en ansiedad", "Ideal: retirarlas al primer mes de control.", 1], ["1.7", "¿Qué dosis de fluoxetina puede requerirse en un TOC con dismorfia corporal?", "Hasta 120 mg", "20 mg", "40 mg como máximo", "5 mg", "Fluoxetina 20 mg es poco; las dosis de inicio no son dosis de tratamiento.", 2], ["1.7", "¿Qué dice la clase sobre el uso crónico de los IRS?", "No hay evidencia de daño orgánico", "Producen daño hepático progresivo", "Causan deterioro cognitivo a largo plazo", "Deben suspenderse siempre a los 6 meses", "La resistencia de los pacientes suele ser un tema de representación social del psicofármaco, no un riesgo médico real.", 2], ["1.7", "Paciente con ansiedad que lleva 6 meses con sertralina 50 mg sin mejoría. ¿Cuál es la interpretación correcta?", "Nunca estuvo realmente en tratamiento: es dosis de inicio", "Fracaso del ISRS: cambiar a benzodiazepinas", "Es la dosis plena habitual del fármaco", "Es una resistencia que exige indicar litio", "Las dosis de inicio no son dosis de tratamiento: sertralina llega a 200 mg.", 1], ["1.8", "«Me gustaría dormirme y no despertar más para dejar de sufrir», sin plan. Esto es:", "Ideación de muerte", "Ideación suicida (activa)", "Planificación suicida", "Acting suicida", "La ideación de muerte expresa cansancio del padecimiento sin plan. La ideación suicida activa implica pensar en matarse y elaborar el modo de hacerlo.", 2], ["1.8", "¿Con qué frecuencia debe evaluarse la ideación suicida en un paciente con episodio depresivo?", "En cada consulta, hasta la mejoría del ánimo", "Solo en la primera consulta del episodio", "Únicamente si el paciente lo menciona", "Solo cuando hay un intento previo", "El episodio depresivo se considera grave por definición; se debe evaluar ideación suicida en cada consulta hasta que mejore el ánimo.", 1], ["1.8", "¿Qué diferencia la ideación suicida (activa) de la ideación de muerte (pasiva)?", "Activa: hay un plan aunque no se anime a ejecutarlo", "Activa: el paciente no tiene sufrimiento alguno", "Pasiva: hay un plan detallado de ejecución", "Son idénticas y se tratan igual", "La ideación de muerte expresa cansancio del padecimiento sin plan.", 1], ["2.1", "¿En qué se diferencia la fisiopatología del bipolar de la de la ansiedad, siendo que comparten base neurobiológica?", "La amígdala queda librada a su suerte y alterna entre extremos", "La amígdala está atrofiada y no responde a los estímulos", "No hay compromiso de la corteza prefrontal ni del cíngulo", "El cortisol se encuentra crónicamente disminuido", "Comparten amígdala hiperreactiva y pérdida de regulación prefrontal/cingular. En el bipolar la amígdala alterna entre un extremo y otro (todo mal / todo bien), de forma desregulada respecto del entorno.", 1], ["2.2", "¿Cuál es la única diferencia que importa entre bipolar tipo 1 y tipo 2?", "El tipo 1 puede tener episodios de manía; el tipo 2 solo hipomanía", "El tipo 2 tiene depresiones más graves y el tipo 1 no", "El tipo 1 nunca tiene hipomanía", "El tipo 2 puede tener manía pero no depresión", "Tipo 1: puede presentar manía (y también hipomanía). Tipo 2: únicamente hipomanía, nunca manía completa.", 1], ["2.2", "Un paciente tuvo un único episodio maníaco confirmado hace 25 años y nunca más. Hoy consulta por depresión. ¿Qué se concluye?", "Es bipolar: un solo episodio confirmado alcanza", "No es bipolar, porque pasó demasiado tiempo", "Hay que esperar un segundo episodio para diagnosticar", "Corresponde a una ciclotimia sin otro diagnóstico", "Alcanza un solo episodio confirmado (aunque lo refiera un familiar o una internación antigua). Se ajusta el tratamiento aunque hoy solo tenga depresión.", 1], ["2.3", "¿Cuál de estas manifestaciones corresponde a la manía y NO a la hipomanía?", "Alucinaciones auditivas e ideación delirante de grandiosidad", "Menor necesidad de dormir, sin otros cambios", "Aumento de la energía y del rendimiento", "Trabajar 16 horas y dormir 4 sintiéndose perfecto", "La manía puede tener alucinaciones y delirios (típicamente de grandiosidad). La hipomanía no: hay aumento de energía y menor necesidad de descanso, sin alteración del pensamiento ni pérdida del juicio.", 2], ["2.3", "¿Qué proporción de los episodios maníacos tiene rasgos psicóticos, y qué consecuencia tiene para la clasificación?", "Aprox. 75%; el tipo 1 puede ser psicótico y el tipo 2 nunca", "Aprox. 10%; ningún bipolar es psicótico", "Aprox. 75%; el tipo 2 es el psicótico", "Aprox. 25%; solo el tipo 2 puede ser psicótico", "El bipolar tipo 1 en manía cursa con episodio psicótico en ~75% de los casos. El tipo 2 (solo hipomanía) nunca es psicótico.", 3], ["2.3", "¿Por qué en la manía hay conductas de alto riesgo (sexo sin protección, apuestas, gastos excesivos)?", "Disminuye la percepción de peligro", "Aumenta el miedo y el paciente actúa por evitación", "Hay un déficit de glutamato en la corteza prefrontal", "Es consecuencia directa del aislamiento social previo", "El apunte explica que, por disminución de la percepción de peligro (amígdala «apagada» para el riesgo), aparecen esas conductas.", 2], ["2.3", "¿Cómo es el discurso y el ánimo del paciente en manía?", "Ánimo muy elevado, gran energía y discurso acelerado", "Ánimo bajo y discurso pobre", "Ánimo estable con discurso lento", "Ánimo irritable sin cambios en la energía", "Similar a un cómico de stand-up muy extrovertido o a alguien bajo efecto de cocaína.", 1], ["2.3", "La fuga de ideas se describe como:", "Sensación de que los pensamientos van muy rápido", "Bloqueo brusco del pensamiento o del discurso", "Repetición en eco de lo que dice el otro", "Pensamiento enlentecido y empobrecido", "Se acompaña de agitación/excitación psicomotriz.", 2], ["2.3", "¿Cuál es el contenido típico del delirio en la manía?", "De grandiosidad, positivo para el paciente", "De ruina y de culpa, negativo", "De persecución policial por una deuda", "De enfermedad incurable", "Puede haber alucinaciones auditivas e ideación delirante en la manía.", 2], ["2.3", "«Con mi plata hago lo que quiero» ilustra:", "Conducta de riesgo por menor percepción de peligro", "Ideación delirante persecutoria", "Compulsión de verificación ritual", "Síntoma negativo de esquizofrenia", "Otras conductas: sexo sin protección con desconocidos y apuestas desmedidas.", 2], ["2.3", "Paciente con ánimo muy elevado, discurso acelerado, delirios de grandeza y alucinaciones auditivas. ¿Qué diagnóstico corresponde?", "Manía con rasgos psicóticos: bipolar tipo 1", "Hipomanía de un bipolar tipo 2", "Esquizofrenia paranoide", "Trastorno delirante de tipo grandioso", "El tipo 1 puede ser psicótico (~75% de las manías); el tipo 2, que solo tiene hipomanía, nunca.", 1], ["2.4", "¿Qué conviene preguntar en la anamnesis para detectar una hipomanía, que rara vez motiva la consulta?", "Por la vida cotidiana: «¿qué ya no podés hacer que antes sí?»", "Si tuvo algún día aislado de mucha energía", "Si consume café o estimulantes con frecuencia", "Solo por antecedentes de internación psiquiátrica", "La persona en hipomanía recién consulta cuando no puede sostener el ritmo. Un día aislado de mucha energía no es hipomanía: el criterio temporal sostenido (días/semanas) es central.", 2], ["2.4", "¿Qué criterio es central para hablar de hipomanía y no de «un día con mucha energía»?", "La duración sostenida de días o semanas", "La presencia de alucinaciones auditivas", "La necesidad de internación", "El uso previo de estimulantes", "Un día aislado de mucha energía (tras dormir bien o por cafeína) no es hipomanía.", 2], ["2.4", "¿Cuándo consulta típicamente una persona en hipomanía?", "Cuando ya no puede sostener ese ritmo", "Al inicio del episodio, por la euforia", "Nunca consulta, bajo ninguna circunstancia", "Siempre por insistencia de la pareja", "Por eso conviene preguntar por la vida cotidiana.", 1], ["2.4", "Hombre de 34 años: hace dos semanas trabaja 16 horas, duerme 4 y se siente perfecto. Sin alucinaciones ni delirios, juicio conservado. ¿Qué cuadro tiene?", "Hipomanía, compatible con un bipolar tipo 2", "Manía psicótica de un bipolar tipo 1", "Trastorno de ansiedad generalizada", "Un día de mucha energía sin significado clínico", "En la hipomanía no hay alteración del pensamiento, alucinaciones ni delirios. Los criterios de duración (días o semanas) la separan de un día aislado.", 1], ["2.5", "¿Cómo es el delirio en la depresión bipolar con rasgos psicóticos (melancolía)?", "De contenido negativo", "De grandiosidad y engrandecimiento", "De contenido erotomaníaco, siempre", "No existe: la depresión bipolar nunca es psicótica", "En la depresión psicótica el delirio es negativo, a diferencia del contenido positivo/grandioso del delirio maníaco.", 2], ["2.6", "¿Qué es el viraje maníaco y por qué es gravísimo?", "Pasaje en días a energía maníaca con ánimo deprimido, con riesgo suicida", "Cambio lento de depresión a manía a los 2 meses de tratamiento", "Remisión espontánea de la depresión con el antidepresivo", "Hipomanía benigna que aparece después del alta", "Ocurre en las primeras semanas (nunca al mes y medio). En depresión pura la abulia protege; en el viraje se recupera la energía primero pero el ánimo sigue deprimido y la ideación persiste: emergencia psiquiátrica.", 1], ["2.6", "¿En qué situaciones obliga a sospechar bipolaridad un primer episodio depresivo?", "Adolescentes y primer episodio depresivo en el embarazo", "Solo en mayores de 60 años con depresión", "Solo si hay antecedente de abuso de sustancias", "Únicamente en el puerperio inmediato", "La anamnesis de todo primer episodio depresivo debe buscar manía/hipomanía previa. Es especialmente importante en adolescentes y en el primer episodio durante el embarazo.", 2], ["2.6", "Según el docente, el aumento del riesgo suicida descrito con antidepresivos en adolescentes se debe a:", "Mala práctica (no evaluar ideación ni descartar bipolaridad)", "Efecto directo e inevitable de todo antidepresivo", "La edad de los pacientes, exclusivamente", "Una interacción con el litio en el tratamiento", "El docente lo atribuye a mala práctica y no al fármaco en sí.", 1], ["2.6", "¿Cómo se previene el viraje cuando hay sospecha de bipolaridad y hay que dar antidepresivo?", "Asociar estabilizador o antipsicótico atípico", "Dar el antidepresivo a dosis mínima, sin cobertura", "Indicar solo benzodiazepinas durante el episodio", "Esperar 1 mes y medio antes de indicar fármacos", "Se cubre con estabilizador o antipsicótico atípico y se retira esa cobertura una vez resuelta la ideación suicida.", 1], ["2.6", "En una depresión pura, ¿por qué la ideación suicida suele no llevar al acto?", "Hay abulia: no tiene energía para ejecutarla", "El ánimo está elevado y lo protege", "Hay delirios de grandeza que lo frenan", "Está sedado por la propia depresión", "A medida que mejora, primero se recupera la energía y luego desaparece la ideación, sin riesgo real.", 2], ["2.6", "¿En qué momento aparece el viraje maníaco tras iniciar un antidepresivo?", "En días, dentro de las primeras semanas de tratamiento", "Al mes y medio, de forma lenta y gradual", "A los 6 meses de iniciado el fármaco", "Solo después de suspender el antidepresivo", "Nunca al mes y medio de evolución lenta.", 1], ["2.6", "Mujer de 28 años con primer episodio depresivo. A los 10 días de iniciar un ISRS casi no duerme, está llena de energía, pero sigue con ánimo bajo y habla de morir. ¿Qué ocurre?", "Viraje maníaco: tiene energía para actuar la ideación suicida", "Respuesta antidepresiva adecuada y precoz", "Efecto adverso gastrointestinal sin importancia", "Cuadro de ansiedad por abstinencia del ISRS", "Es una emergencia psiquiátrica: se recupera la energía antes que el ánimo. Obliga a pensar en bipolaridad no diagnosticada.", 1], ["2.6", "Mujer de 26 años, sin antecedentes, con un primer episodio depresivo en el segundo trimestre de embarazo. ¿Qué hay que sospechar?", "Trastorno bipolar", "Depresión posparto anticipada", "Un trastorno de ansiedad por el embarazo", "Una depresión unipolar sin otra consideración", "El primer episodio depresivo durante el embarazo (no el posparto) obliga a sospechar bipolaridad.", 1], ["2.6", "Adolescente de 15 años con un primer episodio depresivo. ¿Qué debe hacerse antes de indicar un antidepresivo?", "Buscar manía o hipomanía previas y evaluar ideación suicida", "Indicar el antidepresivo y reevaluar en 2 meses", "Pedir directamente estudios por imágenes", "Indicar benzodiazepinas durante 6 meses", "El bipolar puede debutar desde los 13 años. El riesgo suicida atribuido a antidepresivos en adolescentes se debe, según el docente, a mala práctica.", 1], ["2.7", "Un paciente bipolar cambia de deprimido a la mañana a maníaco a la tarde. Es un ciclador:", "Ultrarrápido", "Rápido", "Lento", "Ultralento", "Ultrarrápido: cambios en el mismo día. Rápido: más de un episodio en el mismo año. Lento/ultralento: años entre episodios.", 1], ["2.7", "¿Qué es un episodio mixto?", "Depresión y manía/hipomanía a la vez", "Una manía seguida de una depresión a los 6 meses", "Oscilaciones leves del ánimo sin llegar a umbral", "Un episodio de hipomanía con rasgos psicóticos", "Ej.: llanto y desesperanza junto con inquietud motriz e insomnio. Es emergencia por el riesgo de suicidio con energía disponible. Las oscilaciones leves sin llegar a umbrales son ciclotimia, que no es patológica.", 2], ["2.7", "¿Qué es un ciclo en el trastorno bipolar?", "Ir de la eutimia a un polo, pasar o no por el otro y volver", "Un episodio depresivo aislado y único", "El tiempo entre dos internaciones consecutivas", "Un episodio de hipomanía de una semana", "Los cicladores varían en velocidad.", 2], ["2.7", "Un ciclador rápido es aquel que presenta:", "Más de un episodio dentro del mismo año", "Un episodio cada 10 años", "Cambios dentro del mismo día", "Un solo episodio en toda la vida", "Lento/ultralento: años entre episodios. Ultrarrápido: cambios en el mismo día.", 2], ["2.7", "¿Es patológica la ciclotimia?", "No: oscila levemente sin alcanzar umbrales", "Sí: equivale a un bipolar tipo 2", "Sí: equivale a un bipolar tipo 1", "Sí: requiere litio siempre", "No alcanza los umbrales de manía, hipomanía ni depresión.", 2], ["2.8", "Un bipolar ciclador lento, con años entre episodios, ¿necesita tratamiento continuo?", "Sí: es crónico y progresivo", "No, basta tratar solo el episodio agudo", "No, a los 2 años sin episodios se suspende", "Solo si es tipo 1 y con síntomas psicóticos", "El trastorno bipolar no tiene cura. El objetivo es sostener la eutimia y que los episodios sean lo más leves y breves posible.", 1], ["2.8", "¿Por qué es esperable rotar la medicación una vez resuelto el episodio agudo aunque responda bien?", "Hay fármacos mejores en fase aguda y otros en mantenimiento", "La tolerancia aparece a las 2 semanas de tratamiento", "Los fármacos pierden toda su eficacia después del primer mes", "El litio solo es útil durante la fase aguda", "El apunte lo plantea así: fármacos con mejor evidencia para la fase aguda y otros para el mantenimiento.", 2], ["2.8", "¿Cuál es el objetivo del tratamiento del trastorno bipolar?", "Sostener la eutimia", "Curar el trastorno de forma definitiva", "Retirar toda la medicación a los 2 años", "Evitar solo los episodios de manía", "El trastorno no tiene cura; es crónico y progresivo.", 1], ["2.9", "¿Qué significa «polaridad predominante» de un fármaco?", "Qué polo cubre mejor el fármaco", "Qué tan rápido actúa el fármaco elegido", "Si es un fármaco de primera o segunda generación", "Si el fármaco requiere control de litemia", "La lamotrigina cubre el polo depresivo; por eso se combina con aripiprazol, risperidona, olanzapina o valproato para cubrir ambos polos.", 2], ["2.9", "¿Con qué suele combinarse la lamotrigina para cubrir ambos polos?", "Aripiprazol, risperidona, olanzapina o valproato", "Benzodiazepinas de acción prolongada", "Antidepresivos en monoterapia", "Metilfenidato en dosis bajas", "La lamotrigina cubre mejor el polo depresivo.", 2], ["2.10", "¿Cuál es la droga de primera línea ante cualquier diagnóstico de trastorno bipolar (tipo 1 o 2) según el docente?", "Litio", "Lamotrigina", "Quetiapina", "Carbamazepina", "El docente es enfático: la evidencia es contundente en que el litio es la primera droga, incluso si el paciente viene de años de otros tratamientos.", 1], ["2.10", "¿Cuál es el mecanismo neurotrófico del litio?", "Inhibe la GSK3-beta", "Bloquea los receptores dopaminérgicos D2", "Aumenta la transmisión GABAérgica", "Inhibe la recaptación de serotonina", "Al inhibir la GSK3-beta favorece la recuperación de conexiones sinápticas perdidas, con el mismo principio neurotrófico que los antidepresivos por otra vía.", 1], ["2.10", "El litio en el embarazo:", "Es seguro en toda la gestación y se ajusta tras el parto", "Está contraindicado durante todo el embarazo", "Es seguro solo durante el primer trimestre", "Solo se indica después del parto", "Esto es clínicamente relevante: ante un primer episodio depresivo en el embarazo hay que sospechar bipolaridad, y el litio es una herramienta segura.", 1], ["2.10", "¿Cuál es el rango terapéutico de la litemia?", "0,8–1,2 mEq/L", "0,1–0,3 mEq/L", "2,0–3,0 mEq/L", "8–12 mEq/L", "Requiere litemia periódica: no alcanza con contar comprimidos.", 2], ["2.10", "Un paciente en tratamiento con litio desarrolla hiponatremia. ¿Qué ocurre?", "No se elimina, se acumula y aparecen efectos adversos", "Se elimina en exceso y pierde eficacia", "No pasa nada: las vías de excreción son distintas", "Aumenta su eficacia sin ningún riesgo", "Litio y sodio comparten excreción renal. Hiponatremia → acumulación del litio. Hipernatremia → eliminación excesiva y pérdida de eficacia. Hay que educar sobre ingesta de sal y agua.", 1], ["2.10", "Según el docente, ¿por qué muchos colegas evitan el litio?", "Por la litemia y el balance sodio-litio: un error de manejo", "Porque tiene menos evidencia que otros estabilizadores", "Porque es peligroso durante el embarazo", "Porque no puede sostenerse a largo plazo", "Los dos «peros» llevan a muchos a ir a quetiapina, risperidona, aripiprazol o carbamazepina. Para el docente es un error de manejo.", 1], ["2.10", "¿Qué ocurre con el litio si el paciente tiene hipernatremia?", "Se elimina en exceso y pierde eficacia", "Se acumula y produce toxicidad", "No se modifica su eliminación", "Aumenta su absorción intestinal", "Hiponatremia: el litio no se elimina y se acumula. Hay que educar sobre ingesta de sal y agua.", 1], ["2.10", "¿Hasta cuándo puede sostenerse el litio?", "De por vida, mientras el paciente lo tolere", "Un máximo de 2 años de tratamiento", "Hasta resolver el primer episodio agudo", "Solo durante la fase maníaca", "Si aparecen reacciones adversas significativas se evalúa suspensión o rotación; puede combinarse con otro estabilizador o antipsicótico.", 1], ["2.10", "Paciente bipolar medicado con litio que, por una gastroenteritis, queda con hiponatremia. ¿Qué riesgo corre?", "Acumular litio y tener efectos adversos o toxicidad", "Perder eficacia del litio por eliminarlo de más", "Descompensar la manía por falta de sodio", "Ninguno, porque el litio no depende del sodio", "Litio y sodio comparten la excreción renal: hiponatremia → el litio no se elimina.", 1], ["2.11", "Según la tabla del DSM-5 vista en clase, ¿qué requiere el diagnóstico de trastorno bipolar tipo I?", "Que exista un episodio maníaco", "Que existan un episodio hipomaníaco y uno depresivo", "Que haya al menos dos episodios depresivos", "Que haya habido una hospitalización previa", "El encabezado de la tabla dice que el tipo I requiere que exista un episodio maníaco.", 1], ["2.11", "¿Cuál es la duración mínima del episodio maníaco y del hipomaníaco en la tabla?", "Manía: 1 semana; hipomanía: al menos 4 días consecutivos", "Manía: 4 días; hipomanía: 1 semana", "Manía: 2 semanas; hipomanía: 7 días", "Manía: 1 día; hipomanía: 4 horas", "En ambos el ánimo elevado, expansivo o irritable y el aumento de la actividad y energía son casi todo el día y todos los días.", 1], ["2.11", "¿Cuántos síntomas de la lista se requieren si el ánimo es exclusivamente irritable?", "Cuatro", "Tres", "Dos", "Cinco", "Con ánimo elevado o expansivo bastan 3 o más; si es solo irritable, 4. Vale igual para manía e hipomanía.", 1], ["2.11", "¿Cuál de estos NO es uno de los síntomas de la lista del episodio maníaco?", "Ideas de ruina y de culpa", "Descenso de la necesidad de dormir", "Fuga de ideas o rapidez subjetiva de las ideas", "Implicación en actividades peligrosas o de riesgo", "La lista: grandiosidad y autoestima exagerada, menos necesidad de dormir, habla más y presiona para seguir hablando, fuga de ideas, distractibilidad, más actividad o agitación psicomotriz y actividades de riesgo.", 1], ["2.11", "¿Qué distingue al episodio hipomaníaco del maníaco en cuanto a gravedad?", "La perturbación no es tan grave como para precisar hospitalización", "Siempre hay rasgos psicóticos", "El ánimo nunca es irritable", "Dura más de 1 semana", "En la manía hay dificultades de funcionamiento y puede requerirse hospitalización o haber rasgos psicóticos. En la hipomanía el cambio es evidente para los demás, pero sin hospitalización.", 1], ["2.11", "Paciente con 5 días de ánimo elevado, mucha energía, poco sueño y habla excesiva. El cambio es evidente para los demás, sin hospitalización ni psicosis. ¿Qué episodio es?", "Hipomaníaco", "Maníaco", "Mixto", "Depresivo", "Cumple los 4 días mínimos de la hipomanía y no tiene la gravedad de la manía.", 1], ["2.11", "¿Qué indica la tabla sobre el episodio maníaco y el tratamiento antidepresivo?", "Puede surgir en el curso de un tratamiento antidepresivo", "Nunca ocurre con antidepresivos", "Solo ocurre al suspender el antidepresivo", "Solo ocurre con el uso de litio", "Se relaciona con el viraje maníaco (sección 2.6).", 1], ["2.11", "¿Qué dice el pie de la tabla sobre los episodios hipomaníacos?", "Son frecuentes en el curso del bipolar, aunque no necesarios para el diagnóstico", "Son imprescindibles para el diagnóstico", "Son incompatibles con el tipo I", "Solo aparecen antes del primer episodio maníaco", "La tabla está centrada en el tipo I, que requiere el episodio maníaco.", 2], ["3.0", "¿Por qué el término «neurosis» fue retirado como categoría diagnóstica en el DSM-III?", "Por el criterio de ateoricidad", "Porque se demostró su base genética", "Porque se unificó con psicosis", "Porque se vio que no existía", "Se retiró por el criterio de ateoricidad. Lo que se agrupaba como neurosis hoy se reparte entre pánico, TAG, TEPT, conversión, fobias (social y específica) y TOC.", 3], ["3.1", "¿Qué cambio teórico hace Freud tras atender a «Dora»?", "Pasa de la teoría traumática a la del conflicto", "Pasa de la teoría del conflicto a la traumática", "Abandona el psicoanálisis y adopta el apego", "Pasa de las pulsiones a la segunda tópica", "«Me engañaron mis histéricas»: el conflicto psíquico, no el trauma real, es el núcleo de la neurosis.", 2], ["3.1", "Con la 2ª tópica (1923, «El yo y el ello»), el conflicto pasa a ser entre:", "Ello y superyó", "Pulsiones sexuales y de autoconservación", "Eros y Tánatos", "Consciente e inconsciente", "1ª teoría de pulsiones (1905–1919): sexuales vs autoconservación. 2ª (desde 1919): Eros vs Tánatos. Con la 2ª tópica: ello vs superyó.", 2], ["3.1", "¿Dónde hizo Freud su pasantía, donde Charcot vinculaba la histeria con la sexualidad?", "En la Salpêtrière (París)", "En el Hospital de Viena", "En la Charité de Berlín", "En el Burghölzli de Zúrich", "Freud desarrolló primero la teoría traumática.", 2], ["3.1", "¿Cuáles son las etapas del desarrollo psicosexual mencionadas?", "Oral, anal, fálica y complejo de Edipo", "Sensoriomotora, preoperatoria y operatoria", "Confianza, autonomía e iniciativa", "Apego, exploración y separación", "La teoría traumática sostenía que los neuróticos adultos habían sufrido traumas sexuales reales en esas etapas.", 2], ["3.1", "Según la 2ª teoría de las pulsiones (desde «Más allá del principio del placer», 1919), el conflicto es entre:", "Eros y Tánatos", "Pulsiones sexuales y de autoconservación", "Ello y superyó", "Consciente e inconsciente", "La 1ª teoría (1905–1919) era sexuales vs autoconservación.", 2], ["3.2", "¿Cuál es la definición de síntoma neurótico en el apunte?", "Una formación de compromiso entre el deseo y la defensa", "Un déficit de neurotransmisores cerebrales", "Una pérdida de la prueba de realidad", "Un trauma sexual real vivido en la infancia", "La neurosis es una enfermedad por conflicto psíquico de origen inconsciente entre un deseo no permitido y una defensa. El síntoma es una formación de compromiso.", 2], ["3.2", "Las neurosis son enfermedades:", "Egodistónicas, por regresión", "Egosintónicas, sin conflicto edípico de base", "Por pérdida de la prueba de realidad", "Por fijación exclusiva en etapas pre-edípicas", "Generan malestar al yo (cuerpo extraño), son por regresión a puntos de fijación libidinal y su conflicto es edípico.", 2], ["3.2", "En la metáfora de Freud del pueblo que viaja a la «tierra prometida», ¿qué representa la regresión?", "Volver transitoriamente a vivir como en un punto de fijación", "Llegar por fin a la etapa genital del desarrollo", "Quedarse a vivir para siempre en una estación", "Abandonar el viaje de forma definitiva", "La fijación son los familiares que se quedan a vivir en una estación; la regresión es volver transitoriamente a esas ciudades. Esto habilita el tratamiento psicoanalítico clásico, porque el paciente puede regresar en sesión y volver a la realidad.", 2], ["3.2", "¿Dónde se origina el conflicto neurótico en cada tópica?", "Inconsciente en la 1ª tópica y ello en la 2ª", "Preconsciente en la 1ª y yo en la 2ª", "Superyó en ambas tópicas", "Conciencia en ambas tópicas", "Las neurosis son enfermedades por conflicto psíquico de origen inconsciente.", 2], ["3.2", "¿Por qué el paciente neurótico puede hacer psicoanálisis clásico?", "Regresiona en sesión y vuelve a la realidad", "No tiene conflicto inconsciente", "Su prueba de realidad está abolida", "No tiene defensas psíquicas", "Conserva la capacidad psíquica de ir y venir.", 1], ["3.3", "La neurosis obsesiva se asocia a una fijación:", "Anal", "Oral", "Fálica", "Genital", "Obsesiva: fijación anal (control/descontrol, control de esfínteres). Histeria y fobia: fijación fálica, coincidente con el complejo de Edipo.", 2], ["3.3", "El caso de Isabel de R. ilustra:", "Conversión: el conflicto edípico reprimido se hace síntoma corporal", "Fobia a los velorios y a la muerte de familiares", "Ritual obsesivo con rumiación ideica", "Neurosis traumática por la pérdida", "Enamorada del cuñado, tras la muerte de la hermana el pensamiento inconsciente retorna en el velorio y al día siguiente no puede caminar.", 2], ["3.3", "Paciente con leptospirosis tratada en el Muniz que desarrolla ceguera súbita, con tomografía normal, resuelta con tratamiento psiquiátrico. ¿Qué es?", "Conversión clásica", "Hipocondría", "Fobia", "Delirio hipocondríaco", "Es el caso del docente: ceguera súbita sin causa orgánica ni farmacológica, resuelta con tratamiento psiquiátrico. Conversión.", 1], ["3.3", "¿Cuál es la diferencia entre obsesión y compulsión?", "Obsesión: idea intrusiva; compulsión: ritual que neutraliza", "Obsesión: el acto; compulsión: la idea intrusiva", "Ambas son actos motores repetitivos", "Ambas son ideas egosintónicas, sin ansiedad", "Obsesión = idea intrusiva. Compulsión = el acto/ritual que neutraliza la ansiedad.", 1], ["3.3", "Dos pacientes se lavan las manos sin parar. ¿Cuál es el neurótico obsesivo?", "El que reconoce que están limpias pero no puede evitarlo", "El que cree realmente que están sucias aunque estén limpias", "Ambos, porque el síntoma es idéntico en los dos casos", "Ninguno, porque el lavado de manos no es un síntoma", "Mismo síntoma, distinto juicio: el psicótico cree que están sucias (pérdida de la prueba de realidad); el obsesivo conserva la crítica y consulta por el malestar.", 1], ["3.3", "¿Qué rasgos presenta la fijación anal de la neurosis obsesiva?", "Control y descontrol", "Teatralidad, seducción y búsqueda de atención", "Idealización y devaluación alternantes", "Aislamiento afectivo y desconfianza", "La analidad se relaciona con el control de esfínteres: retener vs expulsar.", 2], ["3.3", "¿Cuál es el síntoma principal de la histeria?", "La conversión", "La obsesión", "La compulsión", "La alucinación", "Aparición brusca de un síntoma, típicamente de la esfera de los sentidos o motor, sin correlato neurobiológico.", 2], ["3.3", "¿Cómo se define la fobia en la teoría psicoanalítica?", "Miedo irracional y desproporcionado que se evita", "Creencia delirante de peligro inminente", "Ritual para calmar la ansiedad", "Síntoma motor sin lesión orgánica", "El avión es estadísticamente de los medios de transporte más seguros.", 2], ["3.3", "¿Cuál es un ejemplo de idea obsesiva egodistónica mencionado en clase?", "Miedo a que se le ocurra una idea suicida", "Convicción de ser perseguido por vecinos", "Escuchar voces que comentan los actos", "Creerse Napoleón", "También: impulsos blasfemos en personas muy religiosas.", 2], ["3.3", "Mujer cuya hermana muere y, tras el velorio, queda sin poder caminar, sin lesión orgánica. ¿Qué mecanismo explica el cuadro?", "Conversión: conflicto edípico reprimido hecho síntoma", "Fobia a los velorios y a la muerte", "Obsesión con ritual de duelo", "Delirium reactivo al duelo", "Es el caso de Isabel de R.; la histeria se asocia a la fijación fálica.", 2], ["3.4", "Según la teoría freudiana de la represión, ¿qué se reprime y qué ocurre con el afecto?", "Se reprime la representación; el afecto se desplaza", "Se reprime el afecto; la representación queda consciente", "Se reprimen ambos por igual, representación y afecto", "No se reprime ninguno de los dos elementos", "Freud sostenía que los afectos no se reprimen pero las representaciones sí. El afecto se desplaza al cuerpo (histeria), a un objeto externo (fobia) o a la cabeza (neurosis obsesiva).", 2], ["3.4", "El afecto desplazado a un objeto externo genera:", "Fobia", "Histeria", "Neurosis obsesiva", "Psicosis", "Al cuerpo → histeria. A un objeto externo → fobia. A la cabeza (rumiación ideica) → neurosis obsesiva.", 2], ["3.5", "En la 2ª teoría de la angustia de Freud (1926, «Inhibición, síntoma y angustia»):", "La angustia es una señal de peligro que activa las defensas", "La represión estanca la libido y eso produce angustia", "La angustia es solo un residuo del trauma del nacimiento", "La angustia aparece como consecuencia de la defensa", "1ª teoría: la represión estanca la libido y produce angustia. 2ª: la angustia es la señal; ante un peligro interno no se puede huir, por eso se activan defensas (y no al revés).", 2], ["3.5", "¿Cuál es la angustia que predomina en la organización neurótica?", "Angustia de castración", "Angustia primordial", "Angustia de separación", "Angustia de abandono", "La castración se vincula al poder/no-poder (el falo representa poder). La primordial es la del nacimiento, sin señal previa; la de separación se refiere a la madre/cuidador.", 2], ["3.5", "¿Qué tipo de angustia explica que las crisis de angustia puedan parecer «sin motivo»?", "La angustia primordial, la única sin señal previa", "La angustia de castración, propia de la neurosis", "La angustia posedípica, del superyó", "La angustia de separación, de la madre", "Las crisis reeditan esa angustia automática primordial.", 2], ["3.5", "¿Cómo es la angustia normal/operativa frente a la patológica?", "Operativa: estudiar; patológica: no presentarse", "Operativa: no presentarse; patológica: estudiar", "Ambas inhiben siempre la conducta", "Ninguna de las dos es útil", "Los 4 tipos: primordial, de separación, de castración y posedípica.", 2], ["3.5", "La angustia posedípica es:", "Temor a perder el amor del superyó", "Miedo a la separación de la madre", "Miedo al castigo físico del padre", "La angustia del propio nacimiento", "El superyó tiene una parte punitiva y una parte amorosa.", 2], ["3.6", "¿Cómo define el apunte el trauma en la neurosis traumática (hoy TEPT)?", "Energía que excede la capacidad psíquica de ligarla", "Cualquier recuerdo desagradable de la infancia", "Un deseo sexual reprimido que retorna", "La pérdida de la prueba de realidad", "Clínica: flashbacks, alteraciones del sueño, angustia y repetición del hecho. En el caso del adolescente expuesto a la bomba, el cuadro reapareció 2-3 meses después ante una amenaza de bomba en un vuelo.", 2], ["3.7", "Identidad integrada, defensas basadas en la represión, prueba de realidad conservada, conflicto edípico y relación de objeto total corresponden a la organización:", "Neurótica", "Borderline", "Psicótica", "Esquizoide", "La neurótica integra virtudes y defectos en sí mismo y en los otros, con vínculos estables y duraderos.", 2], ["3.7", "¿Qué mecanismo de defensa predomina en la organización borderline?", "La escisión y sus derivados", "La represión y sus derivados neuróticos", "La sublimación y el humor, como defensas maduras", "La formación reactiva y el aislamiento", "Defensas primitivas (pre-edípicas). La identificación proyectiva: el paciente expulsa un afecto propio hacia el terapeuta, que empieza a sentirlo.", 2], ["3.7", "¿Qué distingue la organización psicótica de la borderline?", "La prueba de realidad está abolida", "Existe difusión de identidad marcada", "Se usan defensas primitivas, como la escisión", "Predomina una relación de objeto parcial", "Ambas tienen difusión de identidad y defensas primitivas. En la psicótica la prueba de realidad está abolida: «Si yo soy Napoleón, me pueden preguntar cómo me fue en Waterloo».", 2], ["3.7", "Las «unidades de splitting» de Margaret Mahler son normales hasta aproximadamente:", "Los 3 años", "El año", "Los 7 años", "Los 18 años", "Hasta ~3 años el bebé tiene representaciones separadas según gratifican (amor) o frustran (odio). Si persisten más allá, quedan como base de los trastornos de personalidad y de la psicosis.", 2], ["3.7", "¿Qué defensas predominan en la organización neurótica?", "Represión y derivados", "Escisión e identificación proyectiva", "Negación y proyección delirante", "Ausencia de defensas", "Defensas sanas: sublimación, altruismo y humor.", 2], ["3.7", "¿Cómo es la relación de objeto en la organización neurótica?", "Total: integra amor y odio hacia el mismo objeto", "Parcial, tratada como si fuera total", "Parcial y fragmentada en objetos buenos y malos", "Fusional, sin diferenciar el yo del objeto", "En la neurótica el conflicto es edípico y la ansiedad predominante es de castración.", 2], ["3.7", "¿Cuál es la ansiedad predominante en la organización borderline?", "Abandono o engolfamiento", "Castración", "Fragmentación psicótica", "Posedípica", "Relación de objeto parcial, tratada como si fuera total.", 2], ["3.7", "¿Qué excepción de apego se describe en las relaciones del borderline?", "Clinging: dependencia infantil con odio al objeto", "Vínculos profundos y estables en el tiempo", "Aislamiento afectivo total", "Vínculos puramente utilitarios", "«Si me deja, nadie más me va a querer».", 2], ["3.7", "¿Cómo son las relaciones en la variante narcisista de la organización borderline?", "Utilitarias: duran mientras sirven", "Profundas y estables en el tiempo", "Dependientes y de apego intenso", "Inexistentes por aislamiento", "La organización borderline es base de todos los trastornos de personalidad salvo el TOC de personalidad.", 2], ["3.7", "¿Qué es la identificación proyectiva?", "Expulsar un afecto propio hacia el terapeuta", "Imitar al terapeuta en sus gestos", "Negar el afecto que se siente", "Idealizar al terapeuta sin reservas", "Es útil cuando se reconoce y se usa en la interpretación.", 2], ["3.7", "Identidad integrada, represión como defensa, prueba de realidad conservada y conflicto edípico. ¿A qué organización corresponde?", "Neurótica", "Borderline", "Psicótica", "Esquizoide", "La borderline tiene escisión y difusión de identidad; la psicótica, prueba de realidad abolida.", 2], ["3.8", "¿Qué predomina en la etiología de las organizaciones pre-edípicas (borderline y psicótica)?", "Traumas graves; en el Edipo domina la agresión sobre la libido", "Un conflicto edípico bien resuelto en la infancia", "Un duelo reciente en la vida adulta", "Solo factores genéticos, sin influencia ambiental", "Abuso, maltrato, negligencia, abandono o enfermedad grave sin sostén familiar. El Edipo se vive de manera pre-edípica y no se resuelve.", 2], ["3.9", "Un paciente tiene un cuadro psicótico por primera vez a los 58 años. ¿Qué se debe hacer según la regla práctica?", "Buscar organicidad: tumor, ACV o infección", "Diagnosticar esquizofrenia de inicio tardío", "Indicar un antipsicótico y seguir", "Derivar directamente a psicoanálisis", "Un cuadro psicótico que aparece por primera vez después de los 55 años NUNCA es primario. Los síndromes confusionales del anciano (ej. neumonía, ITU afebril) pueden dar excitación y alucinaciones visuales de tipo delirium.", 1], ["3.9", "Hombre de 62 años sin antecedentes psiquiátricos que, por primera vez, presenta delirios y alucinaciones. ¿Cuál es la conducta?", "Buscar organicidad: tumor, ACV, infección", "Diagnosticar esquizofrenia de inicio tardío", "Indicar un antipsicótico sin estudios", "Derivar a psicoterapia", "Un cuadro psicótico que aparece por primera vez después de los 55 años nunca es primario.", 1], ["4.1", "¿Qué son las compulsiones?", "Actos mentales o motores que reducen la ansiedad de la obsesión", "Solo actos motores repetitivos y visibles para otros", "Ideas intrusivas de alta frecuencia en la conciencia", "Conductas de evitación de lugares o personas", "No son solo motoras: repetir una frase mentalmente o formar una «contraimagen» tranquilizadora también cuenta.", 2], ["4.1", "En el DSM-5, el TOC:", "Tiene capítulo propio y ya no es un trastorno de ansiedad", "Sigue incluido dentro de los trastornos de ansiedad", "Quedó dentro de los trastornos psicóticos", "Pasó al grupo de los trastornos de personalidad", "Evolución: DSM-I «reacción obsesivo-compulsiva» → DSM-II «neurosis obsesivo-compulsiva» → DSM-III nace el TOC → DSM-IV dentro de ansiedad → DSM-5 capítulo propio. Posible pregunta de examen.", 2], ["4.1", "¿Cómo define la diapositiva a las obsesiones?", "Pensamientos, impulsos o imágenes recurrentes, vividos como intrusos o no deseados, que causan malestar o ansiedad", "Actos motores repetidos que reducen la ansiedad", "Ideas falsas, fijas e irreductibles que no causan malestar", "Rasgos estables de perfeccionismo y orden", "El sujeto intenta neutralizarlas mediante compulsiones.", 1], ["4.1", "¿Cómo define la diapositiva a las compulsiones?", "Actos mentales o motores para reducir la ansiedad o evitar un evento temido", "Pensamientos intrusos que causan malestar", "Rasgos de personalidad perfeccionista", "Ideas delirantes de contenido persecutorio", "No son solo motoras: también pueden ser actos mentales (ver 4.4).", 1], ["4.1", "¿Es el TOC sinónimo de neurosis obsesiva?", "No: también ocurre en esquizofrenia y psicosis, con alta comorbilidad TOC-esquizofrenia", "Sí: ambos términos describen el mismo cuadro", "Sí, pero solo en adultos jóvenes", "No: el TOC solo ocurre en trastornos afectivos", "La docente aclaró que son cosas distintas y que la comorbilidad TOC-esquizofrenia es muy común.", 1], ["4.1", "¿Por qué el DSM-5 sacó el TOC de los trastornos de ansiedad?", "Porque su fisiopatogenia y su clínica son mucho más complejas que las de la ansiedad", "Porque nunca se acompaña de ansiedad", "Porque responde a los mismos fármacos que la psicosis", "Porque se descubrió un déficit puro de serotonina", "Eso no significa que no se acompañe de ansiedad: lo más común es que sí. Posible pregunta de examen.", 1], ["4.2", "Un paciente de 45 años desarrolla de forma abrupta un cuadro obsesivo-compulsivo. ¿Qué corresponde?", "Descartar causa orgánica: encefalitis, tumor o lesión", "Diagnosticar un TOC típico de inicio tardío", "Diagnosticar un trastorno obsesivo de la personalidad", "Indicar solo TCC con exposición", "El TOC inicia típicamente antes de los 18 años, es raro después de los 30, y si aparece abruptamente después de los 40 hay que descartar organicidad (ej. encefalitis en el circuito córtico-estriado-tálamo-cortical).", 1], ["4.2", "Sobre la epidemiología del TOC:", "Prevalencia 2-3%, ~50% genético, comorbilidad con depresión", "Prevalencia 20-30%, sin ningún componente genético", "Es menos frecuente en esquizofrenia que en la población general", "Inicia típicamente después de los 40 años", "También es más frecuente en esquizofrenia. La depresión mayor suele ser secundaria al TOC crónico no tratado.", 3], ["4.2", "El TOC suele iniciar:", "Antes de los 18 años", "Después de los 50 años, típicamente", "Entre los 30 y los 40 años, típicamente", "Solo en la vejez avanzada", "Si aparece abruptamente después de los 40, hay que descartar causa orgánica.", 2], ["4.2", "¿Con qué suele asociarse la depresión mayor en el TOC?", "Suele ser secundaria al TOC crónico no tratado", "Es previa y causa el TOC", "No hay ninguna asociación entre ambos", "Aparece solo después del tratamiento", "Otras comorbilidades: otros trastornos de ansiedad y TOC de la personalidad.", 2], ["4.2", "Una persona de 42 años desarrolla síntomas de TOC de forma abrupta. ¿Qué debe hacerse primero?", "Preguntar si ya los tuvo antes; si es la primera vez, descartar causa orgánica", "Indicar IRS a dosis altas sin otros estudios", "Diagnosticar TOC de la personalidad", "Esperar 6 m
