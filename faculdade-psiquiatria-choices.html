eses de evolución", "Si ya los tuvo, es probable que reaparezcan por ser un trastorno crónico.", 1], ["4.2", "Según la diapositiva de epidemiología, ¿qué porcentaje de los casos de TOC inicia antes de los 18 años?", "80%", "50%", "30%", "95%", "Muy rara la aparición de novo luego de los 30 años; luego de los 40 hay que descartar causas orgánicas.", 1], ["4.2", "¿Qué prevalencia de TOC muestra la diapositiva en la esquizofrenia?", "12%", "2-3%", "30%", "50%", "El 2-3% es la población general; el 30% es la comorbilidad con tics.", 1], ["4.2", "Entre las comorbilidades de la diapositiva, ¿cuál es la más frecuente en el TOC?", "Trastorno de ansiedad (76%)", "Trastorno depresivo mayor (41%)", "Trastorno de tics (30%)", "TOCP (20-30%)", "Depresivo mayor 41%, tics 30% y TOCP 20-30%.", 2], ["4.3", "¿Qué vía está alterada en la fisiopatología del TOC?", "La córtico-estriado-tálamo-cortical", "La mesolímbica, con hipofunción dopaminérgica", "La nigro-estriada, con pérdida neuronal", "El eje hipotálamo-hipófiso-adrenal", "Explica la incapacidad de inhibir pensamientos y conductas repetitivas y la comorbilidad con tics. La RMN funcional muestra hiperactividad cortical que se normaliza con el tratamiento efectivo.", 2], ["4.3", "¿Es el TOC un simple déficit serotoninérgico?", "No: la evidencia de un déficit específico es débil", "Sí, es un déficit puro de serotonina", "Sí, pero de dopamina prefrontal", "No, es un exceso de serotonina estriatal", "Se lo considera una disfunción compleja de la neurotransmisión.", 2], ["4.3", "¿Con qué otra condición explica la fisiopatología del TOC una alta comorbilidad?", "Los trastornos de tics", "La epilepsia del lóbulo temporal", "El delirium", "La demencia frontotemporal", "La vía córtico-estriado-tálamo-cortical no solo regula el movimiento, también el inicio de procesos cognitivos.", 2], ["4.3", "¿Qué muestra la RMN funcional en el TOC?", "Hiperactividad cortical que se normaliza con el tratamiento", "Hipoactividad cortical permanente", "Atrofia del hipocampo", "Lesiones cerebelosas bilaterales", "Se normaliza cuando el síntoma desaparece.", 2], ["4.3", "En el paciente de 45 años con esquizofrenia y compulsiones, ¿cómo se interpretó históricamente en psicoanálisis el TOC comórbido?", "Como defensa frente a la emergencia de síntomas psicóticos", "Como un efecto adverso inevitable del fármaco", "Como una simulación del paciente", "Como un trastorno de personalidad", "La comorbilidad TOC-esquizofrenia está descrita incluso en la era pre-antipsicótica.", 1], ["4.3", "Función del síntoma obsesivo-compulsivo según la diapositiva de psicoanálisis:", "Neurosis: formación sustitutiva y descarga de la ansiedad; psicosis: defensivo o restitutivo", "Neurosis: defensivo o restitutivo; psicosis: formación sustitutiva", "Ambas: descarga de la ansiedad", "Ambas: restitución del delirio", "Es una pregunta típica de cruce con la clase de neurosis.", 1], ["4.3", "En la tabla de niveles de organización de la personalidad, ¿qué ansiedad corresponde a la psicosis?", "Aniquilamiento", "Castración", "Abandono y separación", "Culpa", "Neurosis: castración. Borderline: abandono y separación.", 1], ["4.3", "Según la tabla de niveles de organización, ¿cuál es el conflicto de la neurosis?", "Edípico", "Preedípico (separación-individuación)", "Preedípico (simbiosis)", "Narcisista", "Borderline: preedípico (separación-individuación). Psicosis: preedípico (simbiosis).", 2], ["4.3", "¿Qué mecanismos de defensa muestra la tabla para neurosis, borderline y psicosis, respectivamente?", "Represión y derivados; escisión y derivados; identificación proyectiva", "Escisión y derivados; represión y derivados; identificación proyectiva", "Identificación proyectiva; escisión; represión", "Represión; negación; proyección delirante", "La prueba de realidad está conservada en neurosis y borderline y abolida en psicosis.", 1], ["4.3", "Neurobiología del TOC según la diapositiva:", "Hiperfunción de la vía directa e hipofunción de la indirecta", "Hipofunción de la vía directa e hiperfunción de la indirecta", "Hiperfunción de ambas vías", "Hipofunción de ambas vías", "Se traduce en incapacidad para inhibir conductas y pensamientos repetitivos.", 1], ["4.3", "¿Qué dice la diapositiva sobre la hipótesis serotoninérgica del TOC?", "Resultó atractiva por la buena respuesta a ISRS y clomipramina, pero con evidencia a favor débil", "Está demostrada como causa única", "Fue refutada: la serotonina no interviene", "Explica por completo el cuadro", "También se nombran dopamina, glutamato y GABA.", 1], ["4.4", "¿Cuál NO es una cualidad formal de las obsesiones?", "Procedencia externa: la idea se vive como insertada desde afuera", "Iteratividad (alta frecuencia en la conciencia)", "Forzamiento (sensación de ser forzado a pensarlas)", "Procedencia interna (se reconocen como propias)", "Las obsesiones se reconocen como producción del propio psiquismo, a diferencia del síndrome de influencia externa de la esquizofrenia. Las cualidades son iteratividad, forzamiento, procedencia interna y (clásicamente) buen insight.", 2], ["4.4", "¿Cuál es el contenido típico de las obsesiones?", "Desagradable, estereotipado y contrario a los valores propios", "Placentero y congruente con los valores de la persona", "Cambiante de una semana a otra, sin tema fijo", "Bizarro e inverosímil, sin relación con la vida", "Ese carácter contrario a los valores aumenta la angustia. Pueden ser autógenas (espontáneas) o reactivas (gatilladas por un estímulo ambiental).", 2], ["4.4", "Las conductas evitativas en el TOC:", "No son criterio diagnóstico, pero interfieren mucho", "Son el criterio diagnóstico principal", "No tienen impacto funcional alguno", "Solo aparecen en el TOC con insight nulo", "Ejemplos: evitar el contacto con sobrinos o no pasar por ciertos lugares.", 2], ["4.4", "Una obsesión autógena es aquella que:", "Aparece de forma espontánea", "Es gatillada por un estímulo ambiental específico", "Se vive como insertada desde afuera", "Se acompaña de insight nulo", "Las reactivas son las gatilladas por un estímulo ambiental específico.", 2], ["4.4", "¿Qué significa «conciencia de inexactitud» en las obsesiones?", "Saber que la idea probablemente no es cierta, sin poder evitarla", "Creer firmemente que la idea es verdadera", "No registrar la idea como propia", "Dudar de la propia identidad", "Es el buen insight clásico del TOC.", 2], ["4.4", "Una idea obsesiva con insight nulo es, en rigor:", "Una idea delirante", "Una idea sobrevalorada", "Un TOC leve", "Una fobia", "El DSM-5 admite TOC con insight bueno, parcial o nulo. Egosintónico (típico del delirio) = insight nulo; egodistónico (idea obsesiva clásica) = buen insight, malestar y ansiedad.", 1], ["4.4", "Joven que sabe que sus ideas de contaminación son exageradas, pero no puede dejar de lavarse. Sufre y consulta. ¿Qué cuadro tiene?", "TOC con buen insight", "Delirio de contaminación", "Fobia específica", "TOC de la personalidad", "Idea egodistónica con conciencia de irrealidad. Se trata con IRS a dosis altas y/o TCC con exposición y prevención de respuesta.", 1], ["4.4", "En un TOC con buen insight, ¿qué se dijo sobre llevar a cabo la idea obsesiva (ej. de daño)?", "Probablemente no la lleve a cabo; hay que evaluarlo, y le genera mucho sufrimiento", "La llevará a cabo en la mayoría de los casos", "Es un riesgo alto que obliga a internar", "Solo la lleva a cabo si toma IRS", "Con insight nulo es una idea delirante, con convicción plena.", 1], ["4.4", "¿Qué porcentaje de personas reporta intrusiones ideativas idénticas a las del TOC?", "Hasta el 90%", "Hasta el 5%", "Hasta el 25%", "Hasta el 50%", "Quienes no tienen TOC las subestiman. En el TOC hay mayor frecuencia de aparición en la conciencia.", 2], ["4.4", "¿Cuál NO está entre los contenidos desagradables de las obsesiones de la diapositiva?", "Ideas de grandeza", "Contaminación", "Simetría y orden", "Preocupaciones somáticas", "También: agresión, daño, sexual, religioso y conductas socialmente inaceptables.", 3], ["4.4", "¿Cuál de estas es una característica del estilo cognitivo de la persona con TOC en el esquema intrusión → obsesión?", "Fusión acción-pensamiento, sobreestimación del peligro y necesidad de certeza", "Baja necesidad de certeza", "Subestimación de las responsabilidades", "Tolerancia al malestar", "Además de la mayor frecuencia de aparición en la conciencia (Pérez Rivera y Borda, 2019).", 2], ["4.4", "Dentro del espectro TOC, ¿qué incluye el grupo somático?", "Anorexia nerviosa y trastorno dismórfico corporal", "Juego patológico y compulsión a comprar", "Síndrome de Gilles de la Tourette y corea de Sydenham", "Trastorno antisocial de la personalidad", "El grupo somático tiene bajo insight, ideación sobrevalorada y resistencia al tratamiento.", 2], ["4.4", "¿Qué incluye el grupo neurológico del espectro TOC?", "Síndrome de Gilles de la Tourette, corea de Sydenham y algunos tipos de autismo", "Anorexia nerviosa y trastorno dismórfico corporal", "Juego patológico y compulsión sexual", "Trastorno antisocial de la personalidad", "El grupo impulsivo incluye juego patológico, compulsión a comprar, compulsión sexual y trastorno antisocial.", 2], ["4.5", "Criterio A del TOC según la diapositiva de la clase:", "Presencia de obsesiones, compulsiones o ambas", "Presencia de obsesiones y compulsiones juntas", "Presencia de ideas delirantes y compulsiones", "Presencia de compulsiones motoras únicamente", "Las obsesiones y las compulsiones pueden presentarse solas o juntas.", 1], ["4.5", "Criterio B del TOC: ¿cuándo se cumple?", "Si consumen mucho tiempo (1 hora diaria o más) o causan malestar o deterioro significativo", "Solo si ocupan más de 8 horas diarias", "Solo si hay internación previa", "Si aparecen menos de 1 hora al día", "El deterioro puede ser social, laboral o de otras áreas de funcionamiento.", 1], ["4.5", "¿Qué exige el criterio C del TOC?", "Que los síntomas no puedan atribuirse a efectos de sustancias o a una afección médica", "Que haya antecedentes familiares de TOC", "Que los síntomas empiecen antes de los 18 años", "Que exista comorbilidad con tics", "Recordar que el TOC de inicio abrupto después de los 40 obliga a descartar organicidad (4.2).", 1], ["4.5", "Criterio D del TOC:", "Los síntomas no se explican mejor por los síntomas de otro trastorno mental", "Los síntomas se explican por un trastorno de ansiedad", "Los síntomas se explican por un trastorno psicótico", "Los síntomas se acompañan siempre de depresión", "Es un criterio de exclusión, como el C.", 1], ["4.5", "¿Cuáles son los especificadores del insight en el TOC según la diapositiva?", "Bueno, pobre (ideas sobrevaloradas) y nulo (ideas delirantes)", "Bueno, regular y malo", "Leve, moderado y grave", "Egosintónico, egodistónico y mixto", "Se relaciona con 4.4: una idea obsesiva con insight nulo es, en rigor, una idea delirante.", 1], ["4.5", "Además del insight, ¿qué otro especificador figura en la diapositiva?", "Trastorno de tics", "Trastorno de personalidad obsesivo", "Edad de inicio temprana", "Respuesta a los IRS", "El TOC tiene alta comorbilidad con tics por la vía córtico-estriado-tálamo-cortical (4.3).", 1], ["4.5", "Un paciente con TOC y certeza absoluta de que sus ideas son verdaderas. ¿Qué especificador de insight corresponde?", "Nulo (ideas delirantes)", "Bueno", "Pobre (ideas sobrevaloradas)", "Con tics", "El insight nulo convierte la idea obsesiva en una idea delirante (ver caso de 4.9).", 1], ["4.5", "¿Qué sustancia citó la docente que puede causar síntomas obsesivo-compulsivos como efecto adverso?", "Clozapina (antipsicóticos atípicos)", "Haloperidol a dosis bajas", "Sertralina", "Metilfenidato", "Hay que descartar sustancias y causas médicas antes de diagnosticar TOC (criterio C).", 1], ["4.5", "¿Qué importancia tiene el criterio de «una hora diaria o más»?", "Es el criterio por consenso para que las obsesiones o compulsiones sean patológicas", "Es la duración mínima de cada compulsión", "Solo aplica a los niños", "Es la dosis mínima de IRS", "Chequear la llave de gas alguna vez es normal. Si lleva una hora, hace llegar tarde o impide ver a los amigos, requiere tratamiento.", 1], ["4.6", "¿Cuál es la diferencia entre el TOC (síndrome) y el trastorno obsesivo-compulsivo de la personalidad?", "El de personalidad es un rasgo estable", "El de personalidad tiene compulsiones más graves", "Son lo mismo con distinto nombre", "El TOC síndrome pertenece al cluster C", "Son entidades distintas que pueden coexistir. Se puede tener TOC sin rasgos obsesivos de personalidad y responder bien a un IRS.", 1], ["4.6", "Persona muy ordenada, perfeccionista, rígida y con dificultad para delegar, sin obsesiones ni compulsiones. ¿Qué cuadro tiene?", "TOC de la personalidad", "TOC (síndrome)", "Esquizofrenia simple", "Trastorno delirante crónico", "Es un rasgo estable del carácter: preocupación por el orden, las normas y el perfeccionismo.", 1], ["4.6", "Joven de 20 años con certeza de estar contaminado (sin insight), rituales extremos, aislamiento y refractario a IRS a dosis altas. ¿Cuál es la interpretación?", "Espectro de la esquizofrenia: la idea es delirante", "TOC grave que requiere más dosis de IRS", "Fobia específica a la contaminación", "Trastorno de ansiedad generalizada", "Con insight nulo, la idea obsesiva es en rigor una idea delirante.", 1], ["4.6", "¿Qué hay en el TAG que no hay en el TOC según la comparación de la clase?", "Preocupaciones cotidianas sin obsesiones ni compulsiones propiamente dichas", "Obsesiones con insight nulo", "Rituales de limpieza", "Compulsiones mentales", "A veces se confunden por la rumiación.", 1], ["4.6", "Sobre la dosis de IRS, ¿qué se dijo al comparar TAG y TOC en esta clase?", "En el TAG puede responder a dosis más bajas; en el TOC siempre se va al rango superior", "Ambos requieren siempre la dosis más alta", "El TOC responde a dosis más bajas que el TAG", "No hay diferencia de dosis entre ambos", "Ejemplo del TOC: sertralina 50-200 → 200. En la clase de ansiedad (1.7) se dijo que 50 mg es solo dosis de inicio.", 1], ["4.6", "¿Cuántos criterios del trastorno de la personalidad obsesivo-compulsiva (301.4) deben cumplirse?", "Cuatro (o más) de los ocho", "Dos de los ocho", "Todos los ocho", "Cinco de los diez", "Incluyen perfeccionismo que interfiere con terminar tareas, dedicación excesiva al trabajo, rigidez y obstinación, entre otros.", 1], ["4.6", "Según la diapositiva del TOCP, ¿qué ocurre con la comorbilidad TOC-TOCP (20-30%)?", "Empeora el pronóstico del TOC", "Mejora el pronóstico del TOC", "No modifica el pronóstico", "Protege de las recaídas", "El TOCP es del cluster C, con rasgos egosintónicos; su tratamiento es psicoterapéutico (eventualmente farmacológico).", 1], ["4.6", "¿Qué defensas operan en el TOCP según la diapositiva?", "Intelectualización, racionalización y formación reactiva", "Escisión e identificación proyectiva", "Negación y proyección delirante", "Disociación y regresión", "Utilización rígida de defensas maduras, con poca flexibilidad adaptativa.", 2], ["4.7", "¿Cómo es el curso del TOC?", "Crónico y fluctuante", "Agudo y autolimitado en pocos meses", "Progresivo hasta la demencia", "Siempre remite en 2 años", "Las exacerbaciones se asocian a abandono del tratamiento o estresores (duelos, rupturas, inicio de residencia).", 2], ["4.7", "¿Cómo describe la diapositiva el curso longitudinal del TOC?", "Crónico, fluctuante («waxing and waning») y con baja tasa de remisión completa", "Agudo y autolimitado", "Progresivo hasta la demencia", "Episódico con recuperación completa entre episodios", "Criterio clínico evolutivo (Kahlbaum-Kraepelin). Las exacerbaciones son espontáneas, por discontinuar el tratamiento o por gatillos psicosociales.", 1], ["4.8", "TOC leve-moderado, sin comorbilidades y con buen insight. ¿Cuál es la conducta?", "Monoterapia: TCC con exposición y prevención de respuesta, o IRS", "Terapia combinada fármaco + TCC siempre", "Antipsicótico atípico en monoterapia", "Psicoanálisis clásico como tratamiento de elección", "TOC grave, con comorbilidades o bajo insight → terapia combinada (fármaco + TCC).", 1], ["4.8", "¿Cuál es la lógica de dosificación del IRS en el TOC?", "Dosis altas, al techo", "Dosis mínima sostenida durante 6 meses", "Dosis de inicio indefinidamente", "Dosis media durante 2 semanas y evaluar", "Es la misma lógica que en ansiedad, pero el objetivo es directamente el techo del rango terapéutico.", 2], ["4.8", "¿Para qué sirve la escala Y-BOCS?", "Medir la gravedad del TOC y hacer seguimiento", "Medir el insight del paciente", "Diagnosticar el TOC por puntaje", "Medir el riesgo suicida", "No hace falta saberla en detalle. Se evalúan tres ejes: comorbilidades, insight (bueno / sobrevalorado / delirante) y gravedad.", 2], ["4.8", "¿Cuáles son los tres ejes de evaluación previa al tratamiento del TOC?", "Comorbilidades, insight y gravedad", "Edad, sexo y ocupación", "Antecedentes, ánimo y sueño", "Peso, presión y laboratorio", "El insight puede ser bueno, sobrevalorado o delirante, y condiciona adherencia y respuesta.", 1], ["4.8", "¿En qué consiste la técnica de exposición y prevención de respuesta?", "Exponerse a lo temido sin hacer la compulsión", "Distraerse de la idea intrusiva", "Evitar toda situación que la gatille", "Interpretar el conflicto edípico", "Es la TCC indicada en el TOC leve-moderado.", 2], ["4.8", "En el TOC leve-moderado, sin comorbilidades y con buen insight, ¿qué se recomienda idealmente?", "TCC con exposición y prevención de respuesta", "Antipsicótico atípico", "Benzodiazepinas sostenidas", "Solo observación", "La monoterapia puede ser no farmacológica.", 1], ["4.8", "¿En qué consiste la exposición y prevención de respuesta?", "Exponerse a la idea, tolerar la ansiedad sin hacer la compulsión y ver que el evento temido no ocurre", "Evitar toda situación que gatille la idea", "Hacer la compulsión más rápido", "Distraerse con actividades", "Es la TCC indicada en el TOC leve-moderado.", 1], ["4.8", "Si el ensayo de 8 a 12 semanas de IRS no da buena respuesta clínica, ¿cómo se considera el TOC?", "Resistente al tratamiento", "En remisión parcial", "Un trastorno de personalidad", "Un delirium", "La docente dijo que las otras estrategias no hace falta saberlas.", 2], ["4.8", "¿Qué escalas figuran en la evaluación previa del tratamiento del TOC?", "Y-BOCS (gravedad) y escala de ideas sobrevaloradas (OVIS, BABS)", "Hamilton y Beck", "MMSE y CAM", "PANSS y BPRS", "Y-BOCS: subclínico, leve, moderado, severo; permite seguimiento.", 1], ["4.8", "Definición de TOC resistente según la diapositiva:", "Reducción menor al 25% del puntaje basal de la Y-BOCS tras 1 o 2 ensayos con ISRS a dosis y tiempo adecuados", "Falta de respuesta a un solo ensayo de 2 semanas", "Reducción menor al 50% con TCC", "Ausencia de remisión completa a los 5 años", "Dosis adecuada: extremo superior del rango normal; tiempo adecuado: 8-12 semanas.", 1], ["4.8", "Antes de considerar a un TOC como resistente, ¿qué debe hacerse?", "Reconsiderar el diagnóstico y evaluar predictores de mala respuesta (pobre insight, trastorno de la personalidad comórbido, tics)", "Suspender el ISRS", "Indicar clozapina", "Pasar directamente a la cirugía", "La docente aclaró en el audio que las otras estrategias no hace falta saberlas.", 1], ["4.8", "¿Qué estrategias figuran para tratar el TOC resistente?", "Rotar de ISRS, aumentar la dosis con control clínico y ECG, rotar a clomipramina y potenciar con antipsicóticos atípicos (risperidona)", "Solo agregar benzodiazepinas", "Solo suspender la medicación", "Solo aumentar la TCC", "Es la lista de la diapositiva.", 2], ["4.9", "Paciente de 20 años con ideación delirante de contaminación (insight nulo), rituales de neutralización, aislamiento desde los 15 años y refractario a IRS a dosis altas. ¿Qué cuadro es?", "Espectro de la esquizofrenia, no un TOC propiamente dicho", "TOC grave que requiere más dosis de IRS", "Trastorno obsesivo-compulsivo de la personalidad", "Fobia específica a la contaminación", "El insight nulo convierte las aparentes obsesiones y compulsiones en ideación delirante. Requirió clozapina.", 1], ["4.9", "Paciente de 45 años con esquizofrenia tratada con clozapina que desarrolla compulsiones de verificación. ¿Qué dos posibilidades se plantean?", "Efecto adverso de clozapina o comorbilidad TOC-esquizofrenia", "Solo un efecto adverso de la clozapina", "Un trastorno obsesivo de la personalidad", "Un cuadro de delirium", "Hay que verificar la relación temporal con el fármaco. La comorbilidad TOC-esquizofrenia está muy descrita.", 1], ["4.9", "¿Cuál es la enseñanza transversal de los casos clínicos de TOC y esquizofrenia?", "Los síntomas negativos importan más que los positivos", "Los síntomas positivos son los más característicos", "El insight no sirve para diferenciar cuadros", "Toda obsesión debe considerarse psicótica", "Los positivos son inespecíficos y aparecen en muchos cuadros.", 2], ["4.9", "Adolescente de 16 años, buena alumna, lectura repetitiva «por si se equivoca», chequeo de la llave de gas, imágenes de daño a la familia que reconoce exageradas. ¿Diagnóstico y tratamiento?", "TOC típico; IRS + TCC", "Esquizofrenia; antipsicótico", "Trastorno bipolar; litio", "TAG; benzodiazepinas", "Hay buen insight e interferencia funcional (llega tarde, evita desayunar). Probable comorbilidad depresiva secundaria.", 1], ["4.9", "En el caso del adolescente que relee reiteradamente los textos, ¿cómo se interpreta la relectura?", "Como una compulsión mental, no como simple ansiedad de rendimiento", "Como una fobia específica", "Como un síntoma psicótico", "Como un rasgo de personalidad normal", "Las compulsiones también pueden ser mentales, como repetir una frase o formar contraimágenes.", 1], ["4.9", "Paciente con esquizofrenia que desarrolla síntomas obsesivo-compulsivos mientras toma clozapina. ¿Qué se verifica y cómo se interpreta?", "La relación temporal con la clozapina: efecto adverso si es secundaria; comorbilidad si aparece igual con otro fármaco", "Se suspende el diagnóstico de esquizofrenia", "Se diagnostica un TOC de personalidad", "Siempre es efecto adverso de la clozapina", "La relación entre síntomas psicóticos y obsesivo-compulsivos se describe desde la era pre-antipsicótica.", 1], ["4.9", "¿Cómo se llamaba antes la esquizofrenia, según la docente?", "Demencia precoz", "Neurosis obsesiva", "Reacción esquizoide", "Psicosis maníaco-depresiva", "Los síntomas negativos y cognitivos son lo más importante; los positivos son floridos pero inespecíficos.", 2], ["5.1", "¿Qué papel tiene el trauma infantil en la esquizofrenia?", "Gatillo, no causa única: sin carga genética no hay esquizofrenia", "Es la causa única y suficiente de la enfermedad", "No tiene ningún papel en la etiología", "Reemplaza al componente genético", "Es multicausal: componente genético casi seguro (sin gen específico) más factores ambientales. La teoría vírica propone infección materna (típicamente gripe) en el embarazo.", 2], ["5.1", "Sobre las formas clínicas de la esquizofrenia en el DSM-5:", "El DSM-5 las eliminó", "El DSM-5 mantiene todas las formas clínicas", "La cátedra también las descartó", "Solo se conserva la forma paranoide", "La cátedra conserva la clasificación clásica.", 2], ["5.1", "¿Cómo se define la psicosis?", "Pérdida o abolición del juicio de realidad", "Presencia de ánimo muy elevado", "Alteración aguda de la atención", "Miedo excesivo a un objeto concreto", "La esquizofrenia es multicausal.", 2], ["5.1", "¿Qué propone la teoría vírica de la esquizofrenia?", "Infección materna (gripe) durante el embarazo", "Infección en plena adolescencia", "Virus infantil que lesiona la corteza", "Infección paterna previa a la concepción", "Predispondría a la aparición clínica en la adolescencia ante un estresor.", 2], ["5.1", "Joven de 20 años, hace 2 años aislado, abandonó el colegio, escucha voces y tiene un delirio persecutorio que cambia de tema. ¿Qué cuadro tiene?", "Esquizofrenia: negativos previos y delirios que cambian", "Trastorno delirante crónico persecutorio", "Psicosis aguda breve con reparación", "Episodio maníaco con síntomas psicóticos", "El aislamiento y el abandono escolar son síntomas negativos: lo más característico. El delirio polimorfo apunta a esquizofrenia.", 1], ["5.2", "¿Qué alteración dopaminérgica se asocia a cada grupo de síntomas?", "Positivos: ↑ mesolímbica; negativos: ↓ prefrontal", "Positivos: ↓ prefrontal; negativos: ↑ mesolímbica", "Ambos con ↑ dopamina mesolímbica", "Ambos con ↓ dopamina prefrontal", "Los positivos son floridos pero inespecíficos; los negativos son los característicos de la esquizofrenia.", 2], ["5.3", "¿Cómo es el pródromo de la esquizofrenia?", "Aislamiento, ideas extrañas y caída del rendimiento, por meses", "Un brote súbito de síntomas positivos, sin aviso", "Euforia con insomnio y aumento de energía", "Desorientación fluctuante con atención alterada", "Típicamente en la adolescencia media a tardía (~20-22 años). El brote está dominado por síntomas positivos.", 2], ["5.3", "¿A qué edad suele iniciar la esquizofrenia?", "Adolescencia media a tardía, ~20-22 años", "Infancia temprana, antes de los 8 años", "Después de los 50 años de edad", "Entre los 35 y los 40 años", "Después de los 55 años un cuadro psicótico nuevo nunca es primario.", 3], ["5.4", "¿Cuál es el tipo de delirio más frecuente en la esquizofrenia?", "Persecutorio", "Celotípico", "De engrandecimiento", "Hipocondríaco", "También existen engrandecimiento, celotípico, fantástico e hipocondríaco (certeza delirante, distinto de la hipocondría por miedo).", 2], ["5.4", "¿Cómo se debe actuar frente al sufrimiento del paciente psicótico?", "Empatizar con su sufrimiento, que es real", "Ignorarlo, porque el delirio es falso", "Confrontar el delirio con evidencia objetiva", "Minimizarlo para no reforzar el delirio", "El sufrimiento es real y muy intenso y la empatía es parte del abordaje.", 1], ["5.4", "Sobre las alucinaciones en la esquizofrenia:", "Predominan las auditivas", "Predominan las visuales sobre las auditivas", "Predominan las táctiles desde el inicio", "Las auditivas son raras al inicio", "La agresividad es rara salvo en el delirio de ataque o comandada por voces. Las voces suelen ser punitivas, rara vez gratificantes.", 2], ["5.4", "«Escuchar el propio pensamiento en voz alta, reconociéndolo como propio» se llama:", "Sonorización del pensamiento", "Interceptación del pensamiento", "Robo del pensamiento", "Ecolalia", "Interceptación: bloqueo brusco. Robo/difusión: el pensamiento sale por radio, TV, redes. Influencia: una máquina o ser externo controla las acciones.", 2], ["5.4", "Un paciente interrumpe bruscamente su discurso, como si el pensamiento se le cortara. Esto es:", "Interceptación del pensamiento", "Ecolalia", "Neologismo", "Ensalada de palabras", "Interceptación = bloqueo brusco del pensamiento/discurso.", 1], ["5.4", "Repetición «en eco» de lo que dice el otro e imitación de gestos o posturas se llaman, respectivamente:", "Ecolalia y ecopraxia", "Neologismo y jergonofasia", "Interceptación y difusión", "Ecopraxia y ecolalia", "Neologismos: palabras nuevas con significado propio. Ensalada de palabras/jergonofasia: discurso incomprensible por mezcla de palabras.", 2], ["5.4", "La flexibilidad cérea se observa en la catatonía:", "Estuporosa (mutismo e inmovilidad)", "Excitatoria (furia catatónica)", "Ninguna de las dos formas", "Solo en la esquizofrenia simple", "La estuporosa requiere alimentación e higiene asistidas. La excitatoria tiene riesgo vital: sujeción física y control de hidratación y temperatura (hipertermia, deshidratación).", 2], ["5.4", "Un delirio celotípico en la esquizofrenia es:", "La certeza de infidelidad de la pareja", "La certeza de ser perseguido", "La certeza de tener un linaje especial", "La certeza de estar gravemente enfermo", "Otros tipos: fantástico, de engrandecimiento y persecutorio (el más común).", 2], ["5.4", "¿Cuándo es frecuente la agresividad en la esquizofrenia?", "Solo si hay delirio de ataque o voces de comando", "Siempre durante el brote psicótico", "Durante todo el pródromo", "En la forma simple", "La agresividad es rara; el riesgo de autolesión es mayor.", 2], ["5.4", "¿Cómo son las voces de la esquizofrenia?", "Suelen ser punitivas, rara vez gratificantes", "Siempre son gratificantes", "Siempre son neutras", "Son siempre de contenido religioso", "Pueden ser dialogadas (hablan sobre el paciente) o de comando.", 2], ["5.4", "Con la progresión del cuadro pueden aparecer alucinaciones cenestésicas. ¿Cuál es un ejemplo?", "Bichos recorriendo el cuerpo o un aparato en el cerebro", "Escuchar el propio nombre en la calle", "Ver sombras en la penumbra", "Oler humo sin ninguna fuente", "Las visuales y cenestésicas nunca predominan sobre las auditivas.", 2], ["5.4", "¿Qué es el fenómeno de influencia?", "Una máquina o ser externo controla sus acciones", "El pensamiento es robado y difundido por radio", "El discurso se bloquea bruscamente", "Repite en eco el discurso ajeno", "Antes se consideraba patognomónico; hoy se sabe que no es exclusivo de la esquizofrenia.", 2], ["5.4", "Transmisión, robo o difusión del pensamiento (por radio, TV o redes) es una alteración del:", "Contenido del pensamiento", "Lenguaje formal", "Nivel de conciencia", "Estado de ánimo", "La interceptación es el bloqueo brusco.", 2], ["5.4", "Los neologismos son:", "Palabras nuevas con significado propio", "Repeticiones en eco", "Mezclas incomprensibles de palabras", "Bloqueos del discurso", "La ensalada de palabras o jergonofasia es el discurso incomprensible por mezcla de palabras.", 2], ["5.4", "¿Qué caracteriza la forma excitatoria de la catatonía?", "Furia con riesgo vital", "Mutismo e inmovilidad con flexibilidad cérea", "Aplanamiento afectivo y abulia", "Excitación eufórica sin riesgo", "El esfuerzo por liberarse puede generar hipertermia y deshidratación.", 2], ["5.4", "La catatonía en el DSM-5:", "Categoría aparte: orgánica o parte de esquizofrenia", "Forma de esquizofrenia exclusivamente", "Tipo de trastorno bipolar", "Forma de delirium hipoactivo", "La marcha basculante o en pasos cortos no siempre es disquinesia tardía: puede ser propia del cuadro.", 2], ["5.5", "¿Qué incluyen los síntomas negativos y qué consecuencia práctica tienen?", "Aplanamiento, anhedonia y abulia", "Alucinaciones y delirios, sin consecuencias funcionales", "Euforia e insomnio con aumento de la energía", "Desorientación y fluctuación de la conciencia", "También: ausencia de pareja y amigos reales, dificultad para sostener un trabajo, apego/fusión con la figura de cuidado.", 2], ["5.5", "¿Qué diferencia hay en la «reparación» tras un episodio entre una psicosis aguda y la esquizofrenia?", "La psicosis aguda (<3 meses) se repara", "No hay ninguna diferencia entre ambas", "La esquizofrenia siempre se repara por completo", "La psicosis aguda nunca se repara", "En la esquizofrenia puede recordar el brote («qué suerte que ya no me persiguen, pero cómo sufrí») sin reconocerlo como irreal.", 1], ["5.5", "¿Cómo son los vínculos del paciente con síntomas negativos?", "Asimétricos: no inicia el contacto, solo recibe", "Intensos y recíprocos en ambos sentidos", "Idealizados y muy cambiantes", "Utilitarios y de corta duración", "Hay ausencia de pareja y amigos reales, y apego/fusión con la figura de cuidado (típicamente la madre).", 1], ["5.5", "¿Qué tipo de trabajo suele poder sostener el paciente con síntomas negativos?", "Tareas simples y de pocas horas", "Trabajos de alta responsabilidad", "Ninguno, siempre es imposible", "Cualquier trabajo a tiempo completo", "Suele requerirse certificado de discapacidad para el sostenimiento económico.", 1], ["5.6", "¿Cuál es la forma clínica más frecuente, de mejor pronóstico e inicio más tardío?", "Paranoide", "Desorganizada (hebefrénica)", "Simple", "Catatónica", "La paranoide permite en muchos casos sostener familia y trabajo simple si se mantiene el tratamiento; las descompensaciones suelen deberse al abandono encubierto de la medicación.", 2], ["5.6", "La forma de peor pronóstico, inicio más temprano y deterioro rápido y profundo es:", "Desorganizada (antes hebefrénica)", "Paranoide, de inicio tardío", "Residual, con síntomas persistentes", "Simple, con solo síntomas negativos", "Mayor riesgo de internaciones prolongadas.", 2], ["5.6", "¿Qué caracteriza a la esquizofrenia simple?", "Forma rara con solo síntomas negativos", "Forma con solo síntomas positivos, sin negativos", "Forma con catatonía permanente", "Forma con remisión parcial y síntomas residuales", "Residual: remisión parcial con persistencia de algunos síntomas.", 2], ["5.6", "¿Qué suele causar las descompensaciones en la esquizofrenia paranoide?", "El abandono encubierto de la medicación", "El consumo moderado de cafeína", "El cambio de estación del año", "La falta de sueño de una noche", "Permite mantener familia, pareja, hijos y trabajo simple si se sostiene el tratamiento.", 1], ["5.7", "¿Por qué el diagnóstico de esquizofrenia es siempre longitudinal y no solo transversal?", "Un primer brote se confunde con una psicosis aguda: se ve en la evolución", "Un solo brote alcanza para confirmar el diagnóstico", "Los síntomas positivos son específicos de la esquizofrenia", "El diagnóstico se confirma con un estudio de laboratorio", "Los antecedentes familiares pesan mucho en la sospecha, igual que en el trastorno bipolar.", 1], ["5.7", "Según la nota psicodinámica, ¿qué muestra que lo genético/constitucional no es prescindible?", "El mismo trauma con simbiosis normal da trastorno de personalidad", "El trauma por sí solo siempre causa esquizofrenia", "La simbiosis patológica explica todo el cuadro", "El doble mensaje no tiene ningún efecto", "Se describe simbiosis patológica (Mahler) con doble mensaje/double bind, pero es complementaria y no determinante por sí sola.", 2], ["5.7", "¿Qué pesa mucho en la sospecha diagnóstica de esquizofrenia, igual que en el bipolar?", "Los antecedentes familiares", "El nivel educativo", "El estado civil", "El lugar de residencia", "El diagnóstico es siempre longitudinal.", 2], ["5.7", "Joven de 22 años con 2 meses de ideas delirantes y alucinaciones, que luego remite por completo y dice «qué loco que estuve». ¿Qué cuadro es más probable?", "Psicosis aguda con reparación completa", "Esquizofrenia desorganizada de inicio juvenil", "Trastorno delirante crónico persecutorio", "Trastorno bipolar tipo 2 con hipomanía", "En la psicosis aguda (< 3 meses) suele haber reparación completa. El diagnóstico de esquizofrenia es longitudinal.", 1], ["5.8", "En la esquizofrenia, el riesgo es mayor de:", "Autolesión o suicidio", "Heteroagresión, más que suicidio", "Ambos riesgos son exactamente iguales", "Ninguno de los dos riesgos es relevante", "Un paciente descompensado sufre y está en riesgo para sí mismo, salvo que el delirio o las voces de comando indiquen defenderse de un ataque percibido.", 2], ["5.8", "¿Quién está en riesgo, primariamente, durante la descompensación de la esquizofrenia?", "El propio paciente", "Terceros desconocidos en la calle", "Los vecinos del paciente", "Los profesionales que lo atienden", "Salvo delirio o voces de comando que indiquen defenderse de un ataque percibido.", 2], ["5.9", "Antipsicóticos típicos vs atípicos: ¿qué afirmación es correcta?", "Atípicos: algo de efecto en negativos", "Los típicos mejoran los síntomas negativos", "Los atípicos son más baratos y sin efectos metabólicos", "Los típicos no producen disquinesia tardía", "Los típicos son más económicos y eficaces en el brote agudo, pero producen disquinesia tardía y parkinsonismo. Los atípicos requieren control de peso, IMC, cintura, perfil lipídico y ECG.", 1], ["5.9", "¿Qué particularidad tiene la risperidona entre los atípicos?", "Por encima de 4 mg se comporta como un típico", "Es el único atípico sin efecto metabólico", "Solo existe en presentación de depósito", "No produce ningún efecto adverso", "Dosis habitual 2-4 mg/día (hasta 6 mg en algunos casos).", 2], ["5.9", "¿Qué dosis habitual en el hospital corresponde a la olanzapina?", "15–20 mg/día", "10–15 mg/día", "400–800 mg/día", "40–80 mg/día", "Haloperidol 10–15 mg; quetiapina 400–800 mg; olanzapina 15–20 mg; risperidona 2–4 mg; lurasidona 40–80 mg (no disponible en el hospital).", 3], ["5.9", "¿Cuándo se habla de esquizofrenia resistente y cuál es el fármaco?", "Tras 3 tratamientos adecuados sin remisión: clozapina", "Tras 1 tratamiento fallido: olanzapina", "Tras 2 años de tratamiento: haloperidol", "Tras 3 tratamientos fallidos: litio", "La clozapina tiene buena eficacia sobre negativos e ideación suicida, pero exige farmacovigilancia por riesgo de leucopenia/agranulocitosis: no se prescribe ni dispensa sin laboratorio reciente adjunto.", 2], ["5.9", "¿Cuál es la limitación importante de la medicación de depósito?", "Una vez aplicada, no se puede retirar si hay un efecto adverso", "Debe aplicarse todos los días para mantener el efecto", "No sirve en pacientes con mala adherencia al tratamiento", "Solo puede usarse junto con clozapina", "Es útil cuando se sospecha o confirma mala adherencia.", 2], ["5.9", "¿Qué efecto tienen los antipsicóticos típicos sobre los síntomas negativos?", "Ningún efecto relevante", "Los mejoran claramente", "Los empeoran siempre", "Los curan", "Son más económicos y de mayor eficacia en el brote agudo, pero producen disquinesia tardía y parkinsonismo.", 1], ["5.9", "¿Qué controles requieren los antipsicóticos atípicos?", "Peso, IMC, cintura, perfil lipídico y ECG", "Solo hemograma mensual de rutina", "Solo función renal cada seis meses", "Ningún control específico", "Desventajas: más caros, síndrome metabólico, mayor riesgo cardiovascular y de ACV.", 1], ["5.9", "¿Qué dosis habitual en el hospital corresponde a la quetiapina?", "400–800 mg/día", "10–15 mg/día", "2–4 mg/día", "40–80 mg/día", "Haloperidol 10–15; olanzapina 15–20; risperidona 2–4; lurasidona 40–80 (no disponible en el hospital).", 3], ["5.9", "¿Qué riesgo exige farmacovigilancia estricta con la clozapina?", "Leucopenia o agranulocitosis", "Hipertiroidismo", "Insuficiencia hepática aguda", "Ototoxicidad", "No debe prescribirse ni dispensarse sin laboratorio reciente adjunto a la receta (responsabilidad médico-legal del prescriptor).", 1], ["5.9", "La clozapina tiene buena eficacia sobre:", "Síntomas negativos e ideación suicida", "Solo síntomas positivos floridos", "Solo la agitación psicomotriz", "Ninguna de las dimensiones clínicas", "Se usa en esquizofrenia resistente: tras 3 tratamientos adecuados sin remisión.", 1], ["5.9", "Paciente con esquizofrenia que no remite tras tres tratamientos adecuados con dosis y fármacos correctos. ¿Qué se indica y qué se exige?", "Clozapina, con laboratorio reciente por agranulocitosis", "Aumentar el haloperidol sin otro cambio", "Asociar benzodiazepinas de forma crónica", "Indicar litio con litemia mensual", "Es la esquizofrenia resistente. La clozapina no se prescribe ni dispensa sin laboratorio adjunto.", 1], ["5.9", "Paciente con esquizofrenia que abandona la medicación oral en forma reiterada. ¿Qué opción conviene considerar?", "Medicación de depósito intramuscular", "Duplicar la dosis oral", "Pasarlo a benzodiazepinas", "Suspender todo tratamiento farmacológico", "Dura 20–30 días; la limitación es que no se puede retirar si aparece un efecto adverso.", 1], ["5.10", "En la psicoterapia del paciente psicótico:", "Se trabaja con la parte sana", "Se interpreta genéticamente el contenido del delirio", "Se confronta el delirio hasta que ceda", "El psicoanálisis clásico es de elección", "Con el tiempo algunos logran conciencia de enfermedad parcial («lo que me pasó no es lo habitual»), lo que ayuda a la adherencia.", 1], ["5.10", "Algunos pacientes psicóticos transfieren con la institución y otros con el terapeuta individual. ¿Cuál es la consecuencia clínica?", "Con la institución: toleran cambiar de terapeuta, no de hospital", "Con la institución: se descompensan al cambiar de terapeuta", "Con el terapeuta: toleran cualquier derivación", "Ninguno de los dos tipos tiene consecuencias clínicas", "El segundo tipo es más diferenciado, pero reedita una dinámica cuasi-simbiótica.", 1], ["5.10", "¿Cuál es el principio ético central del tratamiento de la psicosis?", "«Es distinto, no menos ni más»: acompañar y evitar el peligro", "Lograr que acepte nuestra realidad cuanto antes", "Mantenerlo internado de forma permanente", "Ignorar el delirio y centrarse en la medicación", "La ruptura con la realidad fue la herramienta que encontró para sobrevivir a condiciones adversas. Recursos: terapia ocupacional, talleres protegidos, hospital de día/noche, residencias asistidas, casas a medio camino.", 1], ["5.10", "¿Qué recursos de rehabilitación se mencionan?", "Terapia ocupacional, talleres, hospital de día y casas a medio camino", "Internación prolongada como única herramienta", "Psicoanálisis individual como única herramienta", "Medicación de depósito como única herramienta", "Son fundamentales para evitar internaciones prolongadas por falta de lugar donde vivir.", 2], ["6.1", "¿Qué cambió entre DSM-IV y DSM-5 respecto de la hipocondría y el trastorno dismórfico corporal?", "Hipocondría y dismorfia salieron de somatización", "Ambas pasaron a ser trastornos de ansiedad", "Ambas quedaron dentro de los somatomorfos", "Ambas se eliminaron del manual", "DSM-IV: «trastornos somatomorfos» (incluía hipocondría y dismórfico) → DSM-5: «trastornos de somatización».", 3], ["6.2", "¿Qué diferencia una enfermedad psicosomática de un simple rasgo de somatización?", "Un patrón repetido en el tiempo, no un episodio puntual", "El rasgo de somatización siempre es orgánico", "No hay diferencia entre ambos", "El rasgo es siempre más grave que la enfermedad", "Cada persona suele tener una vía preferencial propia de expresión somática del estrés.", 1], ["6.3", "Una enfermedad psicosomática se caracteriza por:", "Afectación orgánica y funcional", "Afectación funcional sin ninguna lesión orgánica", "Ausencia de afectación orgánica y funcional", "Solo temor a tener una enfermedad grave", "Ejemplos: asma, gastritis, colon irritable, psoriasis, artritis reumatoidea, colitis ulcerosa. En el asma, la crisis puede ser gatillada por anoxia ambiental o por un estresor emocional con la misma alteración de la vía aérea.", 2], ["6.3", "¿Cuál es un ejemplo de enfermedad psicosomática clásica?", "Asma, psoriasis o colitis ulcerosa", "Ceguera de origen conversivo", "Miedo persistente a tener cáncer", "Delirio somático de infestación", "También gastritis, colon irritable y artritis reumatoidea.", 2], ["6.3", "En el asma, la crisis puede ser gatillada por:", "Anoxia ambiental o estrés emocional, igual vía aérea", "Solo por alérgenos inhalados", "Solo por estrés emocional intenso", "Solo por infecciones virales", "Es la multideterminación.", 2], ["6.4", "Según Bowlby, ¿qué ocurre si el cuidador no responde a las señales emocionales del bebé?", "Las señales emocionales dejan de emitirse y predomina lo orgánico", "El bebé se vuelve más expresivo emocionalmente", "Se desarrolla un apego seguro de todos modos", "El bebé aprende a verbalizar antes de lo esperado", "El apego es central hasta los 3-4 años. Los modelos inseguros son ambivalente, evitativo y desorganizado.", 2], ["6.4", "El experimento «Still Face» (cara de piedra) muestra que:", "El bebé intenta reconectar y luego se desespera y llora", "El bebé ignora a la madre y sigue jugando", "El bebé se calma de inmediato", "El bebé imita la cara inexpresiva de la madre", "Fue un experimento de los años 60.", 2], ["6.4", "Los tres elementos de Pierre Marty para un cuadro psicosomático son:", "Pensamiento operatorio, depresión esencial y desorganización progresiva", "Alexitimia, conversión y fobia", "Apego, separación y simbiosis", "Cuerpo para dos, holding y constancia objetal", "Pensamiento operatorio: rígido, concreto, monocorde, sin emoción. Depresión esencial: desvalorización más que tristeza. Desorganización progresiva: cede la rmes", "Buena respuesta a los anticonvulsivantes", "La conversiva suele iniciar tras un factor emocional y ser más prolongada que una crisis epiléptica típica.", 2], ["6.7", "Sobre el trastorno conversivo:", "No es fingido: se adquiere inconscientemente y no sigue vías reales", "Es una simulación consciente para obtener beneficios", "Sigue los dermatomas de forma típica", "Siempre hay lesión demostrable del quiasma óptico", "Es heredero conceptual de la histeria de conversión freudiana (caso Ana O.).", 2], ["6.7", "¿Qué caso freudiano es el paradigma de la histeria de conversión?", "Ana O.", "Dora", "Isabel de R. únicamente", "El pequeño Hans", "Los trastornos conversivos son herederos conceptuales de la histeria de conversión.", 2], ["6.7", "¿Qué ocurre en una paresia conversiva respecto de los dermatomas?", "No hay alteración de dermatomas ni sigue vías reales", "Sigue el dermatoma de la raíz comprometida", "Hay una lesión medular evidente", "Es siempre un cuadro fingido", "Tampoco hay lesión del quiasma óptico en una ceguera conversiva.", 2], ["6.8", "Un paciente tiene la certeza irreductible de padecer una enfermedad inexistente. ¿Cómo se diferencia de la hipocondría y cómo se trata?", "Delirio hipocondríaco: se trata con antipsicótico", "Hipocondría: se trata con IRS", "Trastorno conversivo: se trata con psicoterapia", "Enfermedad psicosomática: se trata con benzodiazepinas", "La hipocondría es miedo o temor a una enfermedad grave (cáncer, HIV), con búsqueda compulsiva de información y evitación.", 1], ["6.8", "¿A qué lleva la hipocondría en la conducta del paciente?", "Búsqueda compulsiva de información y evitación", "Negación total de los síntomas", "Automedicación con psicofármacos", "Internaciones frecuentes por riesgo", "Hoy la información se busca en buscadores o IA conversacional.", 1], ["6.9", "Trastorno dismórfico corporal: ¿qué tratamiento y qué se sabe de la cirugía?", "Antipsicóticos de base", "IRS en monoterapia; la cirugía lo resuelve", "Benzodiaz "Que sea sostenido (>4 semanas) y genere disfuncionalidad real", "Que haya al menos un episodio de agresión física", "Que el niño tenga menos de 3 años", "Que los padres refieran quejas del colegio", "El criterio es la funcionalidad, no la presencia de mal comportamiento. Un niño repetidamente etiquetado de «maleducado» probablemente curse un TOD de base.", 2], ["7.4", "¿Cuál de estas es una característica del TOD?", "Enfado permanente y desafío a la autoridad", "Aislamiento y mutismo", "Miedo intenso a separarse", "Inatención sin conducta desafiante", "También: vengativos, pierden la calma con facilidad y rompen normas deliberadamente.", 2], ["7.4", "Niño con enfado y desafío permanentes a la autoridad durante más de 4 semanas, con disfunción familiar. ¿Qué cuadro tiene?", "Trastorno oposicionista desafiante", "Un berrinche normal para la edad", "TDAH de presentación pura", "Trastorno bipolar infantil", "El criterio es la funcionalidad, no un mal comportamiento aislado.", 1], ["7.5", "La impulsividad se define como:", "Reacción motora inesperada ligada a una emoción", "Aumento constante de la actividad psíquica", "Incapacidad de soportar el malestar ante la frustración", "Respuesta emocional desmedida y mal modulada", "Hiperactividad: aumento constante de actividad (deambulación en el autismo). Intolerancia a la frustración: incapacidad de soportar el malestar. Desregulación emocional: respuesta emocional desmedida.", 2], ["7.5", "¿Cuándo un berrinche pasa a ser patológico?", "Cuando supera los 10 minutos o es muy disfuncional", "Cuando ocurre alrededor de los 2 años", "Cuando incluye llanto intenso", "Cuando dura apenas 2 minutos", "Los berrinches son normales entre los 18 meses y los 3 años y medio/4 años. Muchos pediatras los atribuyen a «falta de límites» cuando puede haber un trastorno del neurodesarrollo de base.", 2], ["7.5", "La desregulación emocional y la intolerancia a la frustración:", "No son exclusivas del neurodesarrollo: aparecen en límite y bipolar
