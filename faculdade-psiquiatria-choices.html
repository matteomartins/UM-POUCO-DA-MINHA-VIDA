iaria", "Reflejos motores básicos del recién nacido", "Funciones sensoriales primarias", "Habilidades motoras finas de la mano", "Maduran con la edad. En el TDAH: dificultad con el manejo del tiempo y tendencia a procrastinar.", 2], ["7.6", "El bajo rendimiento escolar en TEA y TDAH se debe a:", "Dificultad para incorporar los conocimientos esperados", "Falta de interés voluntario", "Un déficit visual no corregido", "Una mala alimentación", "Se traduce en bajas calificaciones y retraso para incorporar contenidos que se sofistican.", 2], ["7.7", "¿Cuál es el tratamiento principal del TEA?", "Terapias de rehabilitación", "Metilfenidato como primera línea", "Litio como estabilizador del ánimo", "Benzodiazepinas de forma sostenida", "El TDAH sí tiene fármaco de primera línea específico.", 1], ["7.7", "En niños pequeños con TEA, ¿qué antipsicótico es de primera elección como antiimpulsivo?", "Aripiprazol, y risperidona como segunda elección", "Olanzapina, y quetiapina como segunda elección", "Quetiapina, y aripiprazol como segunda elección", "Levomepromazina, y olanzapina como segunda elección", "Desde los 12 años pueden sumarse olanzapina y quetiapina. Levomepromazina y prometazina se reservan para casos extremos de hiperactividad o deambulación.", 1], ["7.7", "El cannabidiol en autismo:", "Uso off-label, con efectos colaterales casi nulos", "Aprobado como primera línea para el TEA", "Es el aceite de cannabis, con THC", "Es muy sedante y de uso muy frecuente", "Es el único preparado en Argentina al 99-100%. El valproico (aumento de apetito y peso) y la carbamazepina (sedativa) se usan poco.", 2], ["7.7", "¿Cuál es el fármaco de primera elección en TDAH?", "Metilfenidato", "Atomoxetina", "Aripiprazol", "Valproato", "Anfetamina de bajo poder adictivo; modula las vías dopaminérgica y noradrenérgica en la corteza prefrontal.", 1], ["7.7", "¿Cuál es la farmacocinética del metilfenidato?", "Vida media ultracorta (3h30-4h)", "Efecto acumulativo, requiere semanas para actuar", "Efecto de 24 horas con una única toma", "Inicio de efecto recién a la semana", "Corrige casi exclusivamente la desatención y las fallas de funciones ejecutivas. Existen formulaciones de liberación prolongada.", 2], ["7.7", "¿Qué se exige antes de indicar metilfenidato y qué efectos adversos tiene?", "Evaluación cardiológica previa (prolonga el QT)", "Evaluación renal previa (riesgo de nefrotoxicidad)", "Evaluación hepática previa (riesgo de hepatitis)", "No requiere ninguna evaluación previa", "En niños puede aplanar la curva ponderal (control pediátrico estricto); uso autorizado desde los 6 años.", 2], ["7.7", "La atomoxetina, comparada con el metilfenidato:", "Es de segunda elección y de efecto acumulativo", "Es de primera elección en el TDAH", "Tiene vida media ultracorta", "Corrige principalmente la conducta", "Se reserva para contraindicación o intolerancia al metilfenidato.", 2], ["7.7", "¿Qué efectos adversos tiene el ácido valproico como antiimpulsivo?", "Aumento de apetito y de peso", "Hipotensión y bradicardia", "Insomnio y anorexia", "Tics y convulsiones", "La carbamazepina es bastante sedativa.", 2], ["7.7", "¿Qué particularidad tiene el metilfenidato como fármaco?", "Anfetamina de bajo poder adictivo, actúa en la corteza prefrontal", "Benzodiazepina de acción corta", "Antipsicótico atípico sedativo", "Antidepresivo tricíclico noradrenérgico", "Corrige casi exclusivamente la desatención y las fallas ejecutivas.", 2], ["7.7", "¿Cómo se indica hoy el metilfenidato?", "Todos los días, sobre todo si afecta la regulación emocional", "Solo los días de examen", "Una vez por semana", "Solo por la noche", "Existen formulaciones de liberación prolongada con una sola toma diaria.", 2], ["7.7", "¿Cuál es un efecto adverso del metilfenidato en niños?", "Hiporexia que puede aplanar la curva de peso", "Aumento marcado del apetito", "Sedación marcada", "Hipotensión sostenida", "Otros: tics, convulsiones, insomnio, cefaleas y aumento de la presión arterial.", 1], ["7.7", "¿Qué corrige la atomoxetina?", "Solo las funciones cognitivas, no la conducta", "La conducta y la cognición por igual", "Solo la impulsividad", "Los síntomas negativos", "Se reserva para contraindicación o intolerancia al metilfenidato; no se usa en TEA.", 2], ["7.8", "¿Qué terapia de rehabilitación corresponde a las alteraciones del procesamiento sensorial?", "Terapia ocupacional", "Fonoaudiología", "Psicopedagogía", "Estimulación temprana", "Fonoaudiología: lenguaje. Estimulación temprana: condición neurológica desde el nacimiento. Psicología: conducta y frustración. Psicopedagogía: aprendizaje (casi todos los TDAH la requieren).", 2], ["7.9", "Sobre el sesgo de género en los trastornos del neurodesarrollo:", "Más frecuentes en varones (~80/20)", "Más frecuentes en mujeres que en varones", "Se presentan igual en ambos sexos", "Las mujeres tienen más afectación del lenguaje", "Por ejemplo, el lenguaje suele estar respetado en el autismo femenino. El psicoanálisis históricamente no contempla estas categorías, por lo que el trastorno de base puede pasar inadvertido.", 2], ["7.9", "¿Por qué un paciente del espectro autista tratado solo desde el psicoanálisis puede pasar sin diagnóstico?", "El psicoanálisis no contempla históricamente esas categorías", "El psicoanálisis siempre diagnostica TEA", "Los psicoanalistas no atienden niños", "El TEA no existe en adultos", "Puede pasar por distintos profesionales con diagnósticos alternativos.", 1], ["8.1", "¿Cuáles son los tres criterios generales para hablar de un TCA?", "Patrón alterado, deterioro significativo y persistencia ≥ 3 meses", "Pérdida de peso, amenorrea y atracones recurrentes", "Miedo a engordar, purgas y ejercicio compulsivo", "IMC < 18, ayuno prolongado y aislamiento social", "El diagnóstico es clínico: anamnesis, examen físico y examen del estado mental. Se evalúan seis áreas: conducta, cognitiva, antropométrica, médica, funcional y temporal.", 1], ["8.1", "Valentina (15 años) perdió 8 kg en 6 meses (IMC de 19 a 15,8), elimina alimentos «que engordan», corta la comida en trozos pequeños, no menstrúa hace 1 mes y hace abdominales todas las noches «para compensar». No hay atracones ni purgas. ¿Qué patrón tiene?", "Restrictivo (anorexia): el ejercicio refuerza la baja ingesta", "Purgativo, con ejercicio como compensación", "Bulimia nerviosa con compensación no purgativa", "Trastorno por atracón con ejercicio compensatorio", "En el patrón restrictivo no hay atracones ni purgas; el ejercicio refuerza la baja ingesta y no es compensatorio.", 2], ["8.1", "En la evaluación de un TCA, ¿qué se usa en menores en lugar del IMC?", "La curva de crecimiento", "El perímetro abdominal", "El pliegue cutáneo", "La edad ósea", "El área antropométrica evalúa el IMC y, en menores, la curva de crecimiento.", 2], ["8.1", "¿Qué se evalúa en el área temporal de un TCA?", "Inicio, frecuencia, cronicidad y migración entre subtipos", "Signos vitales y ECG", "Sobrevaloración del peso y la forma", "Impacto laboral y académico", "Las seis áreas son conducta, cognitiva, antropométrica, médica, funcional y temporal.", 2], ["8.1", "¿Qué incluye el área cognitiva de la evaluación de un TCA?", "Sobrevaloración del peso, distorsión corporal y pensamiento dicotómico", "Restricción, atracones y purgas", "Signos vitales y laboratorio", "Impacto social y familiar", "El área conductual incluye restricción, atracones, purgas, ejercicio compulsivo y rituales.", 2], ["8.2", "¿Qué significa que la anorexia sea egosintónica?", "El paciente vive los síntomas como propios y niega la gravedad", "El paciente sufre por sus síntomas y pide ayuda", "El paciente tiene insight completo de su enfermedad", "El síntoma se vive como impuesto desde afuera", "Fenomenología: miedo intenso a engordar desproporcionado al peso, alteración de la imagen corporal, autoevaluación dependiente del peso y rituales (cortar en trozos, esconder comida, comer muy lento).", 2], ["8.2", "Criterios DSM-5 de anorexia nerviosa. ¿Cuál es correcto?", "Peso bajo por restricción, miedo a engordar y distorsión de la imagen", "Atracones recurrentes seguidos de vómitos", "Pérdida de más del 10% del peso en 3 meses", "Ingesta de sustancias no nutritivas por 1 mes", "Se evalúan peso bajo para la edad, sexo y salud.", 1], ["8.2", "En la escala de siluetas (7 figuras), las pacientes con anorexia se identifican:", "Por encima de la 3 o 4 (normopeso)", "En la silueta 1 (muy bajo peso), reconociendo su estado", "En la silueta 7 (sobrepeso), siempre", "Exactamente en la que corresponde a su peso real", "Refleja la distorsión corporal y la falta de reconocimiento de la gravedad.", 3], ["8.2", "¿Cuál es el mecanismo de la amenorrea en la anorexia?", "El déficit energético suprime la GnRH hipotalámica", "Exceso de prolactina por el estrés crónico", "Insuficiencia ovárica primaria", "Aumento de la FSH hipofisaria", "Bradicardia: adaptativa (↓ gasto metabólico, ↑ tono vagal). Lanugo: compensatorio para conservar calor. Osteopenia: hipoestrogenismo y ↓ factor de crecimiento.", 2], ["8.2", "¿Cuál de estos es un ritual típico de la anorexia nerviosa?", "Cortar la comida en trozos, esconderla o comer muy lento", "Comer a escondidas grandes cantidades", "Provocarse el vómito tras la cena", "Rechazar pesarse por miedo a la balanza", "Valentina también pesaba y medía las porciones.", 2], ["8.2", "¿Cuántas figuras tiene la escala de siluetas de las entrevistas de admisión?", "7, de muy bajo peso (1) a sobrepeso (7)", "3, de bajo peso a sobrepeso", "5, de normopeso a obesidad", "10, de peso normal a obesidad", "Las pacientes se identifican por encima de la 3 o 4 aunque tienen muy bajo peso.", 3], ["8.2", "¿Cuál es el mecanismo de la bradicardia en la anorexia?", "Adaptativo: baja el gasto metabólico y sube el tono vagal", "Lesión directa del nodo sinusal", "Exceso de tono simpático", "Hipertiroidismo secundario", "El lanugo es compensatorio para conservar calor; la hipotermia, por menor masa de grasa aislante.", 2], ["8.2", "¿Por qué aparece osteopenia en la anorexia?", "Hipoestrogenismo y menor factor de crecimiento", "Exceso de calcio en orina", "Hiperparatiroidismo secundario", "Falta de vitamina C", "Es una consecuencia de la desnutrición sostenida.", 2], ["8.2", "Mujer de 16 años, IMC 15, amenorrea, miedo intenso a engordar, hace ejercicio para sostener la baja ingesta y no tiene atracones ni purgas. ¿Qué cuadro tiene?", "Anorexia nerviosa, patrón restrictivo", "Bulimia nerviosa con compensación", "Trastorno por atracón", "Anorexia de tipo purgativo", "El ejercicio refuerza la restricción, no compensa una ingesta.", 1], ["8.3", "Signo de Russell, hipertrofia parotídea y erosión dental. ¿A qué conducta corresponden?", "Vómito autoinducido (purga)", "Restricción", "Uso de diuréticos únicamente", "Atracón sin compensación", "El signo de Russell son lesiones en los nudillos por el roce con los dientes al provocar el vómito; la erosión dental es por ácido clorhídrico.", 2], ["8.3", "¿Qué trastorno ácido-base producen el vómito y los laxantes, respectivamente?", "Vómito: alcalosis hipoclorémica", "Vómito: acidosis hiperclorémica; laxantes: alcalosis", "Ambos producen acidosis respiratoria", "Ambos producen alcalosis respiratoria", "El vómito pierde H⁺ y Cl⁻. Además: edema de rebote al suspender diuréticos o laxantes (hiperaldosteronismo secundario) y QTc prolongado.", 2], ["8.3", "En el patrón purgativo, ¿cuál es la vivencia subjetiva de la purga?", "Alivio de la culpa y la ansiedad posingesta", "Sensación de control y de logro", "Placer intenso con la ingesta", "Indiferencia afectiva total", "Restrictivo: sensación de control y de logro; riesgos: desnutrición, bradicardia, amenorrea. Purgativo: riesgos: alteraciones electrolíticas. El atracón previo puede haberlo o no.", 2], ["8.3", "¿Qué ilustra el caso de Valentina que, 3 meses después, vomita tras la cena?", "Los cuadros pueden evolucionar a un patrón compensatorio", "Que fue una bulimia desde el inicio", "Que la anorexia nunca cambia de forma", "Que es un trastorno por atracón", "Había ingestas que ella vive como excesivas, sin atracones y con peso estable.", 2], ["8.3", "¿Cuáles son las conductas compensatorias del patrón purgativo?", "Vómito, laxantes, diuréticos, enemas, ayuno y ejercicio", "Solo el vómito autoinducido", "Solo los laxantes y los diuréticos", "Restricción de grupos de alimentos", "Buscan contrarrestar el efecto calórico de la ingesta.", 2], ["8.3", "¿Por qué aparece edema de rebote al suspender diuréticos o laxantes?", "Por hiperaldosteronismo secundario", "Por hipoalbuminemia aguda", "Por insuficiencia cardíaca", "Por exceso de sodio ingerido", "Otros signos de purga: QTc prolongado en el ECG.", 2], ["8.3", "¿Qué comorbilidad psiquiátrica se asocia al patrón purgativo?", "Labilidad afectiva e impulsividad", "Rasgos del espectro autista", "Síntomas psicóticos persistentes", "Cuadro confusional agudo", "Diferencia con el restrictivo: la vivencia es de alivio de la culpa y la ansiedad posingesta.", 2], ["8.3", "Paciente que se induce vómitos a diario. ¿Qué trastorno ácido-base y qué electrolitos espera?", "Alcalosis metabólica hipoclorémica con hipopotasemia", "Acidosis metabólica hiperclorémica con hiperpotasemia", "Acidosis respiratoria con hipercalcemia", "Alcalosis respiratoria con hiponatremia aislada", "Se pierden H⁺ y Cl⁻. Hay riesgo de arritmia y QTc prolongado.", 1], ["8.4", "Criterios de la bulimia nerviosa:", "Atracones + compensación, ≥ 1 vez por semana durante 3 meses", "Solo atracones, sin ninguna conducta compensatoria", "Peso bajo con amenorrea persistente", "Conducta compensatoria sin atracones previos", "Peso normal o con sobrepeso; síntomas ocultos.", 1], ["8.4", "Según el número de episodios compensatorios por semana, la bulimia grave corresponde a:", "8-13", "1-3", "4-7", "14 o más", "Leve 1-3, moderada 4-7, grave 8-13 y extrema ≥14 (2 por día).", 2], ["8.4", "La bulimia puede compensar de forma no purgativa mediante:", "Ayuno estricto y ejercicio", "Vómito autoinducido", "Uso de laxantes", "Uso de diuréticos", "Hallazgos de la bulimia: alcalosis metabólica, hipopotasemia, hiponatremia, hipomagnesemia, ↑ amilasa, bradicardia y QTc prolongado.", 2], ["8.4", "¿Qué comorbilidad se asocia a la bulimia?", "Depresión, impulsividad y rasgos del cluster B", "Esquizofrenia y trastorno delirante", "Trastorno del espectro autista", "Demencia y deterioro cognitivo", "Hay inestabilidad de los vínculos.", 2], ["8.4", "¿Cómo es el peso en la bulimia nerviosa?", "Normal o con sobrepeso", "Siempre muy bajo", "Siempre con obesidad", "Muy bajo, con amenorrea", "Los vómitos y atracones se hacen a escondidas.", 2], ["8.4", "¿Cómo son los atracones de Valentina a los 17 años?", "Grandes cantidades en minutos, de noche y a solas", "Ingestas pequeñas con restricción posterior", "Comidas lentas y ordenadas", "Ingestas en público sin culpa", "Tenía IMC 19,5.", 3], ["8.4", "¿Cuál es la gravedad de una bulimia con 4 a 7 episodios compensatorios por semana?", "Moderada", "Leve", "Grave", "Extrema", "Leve 1-3, grave 8-13, extrema ≥ 14.", 2], ["8.4", "¿Qué hallazgos de laboratorio se esperan en la bulimia?", "Alcalosis metabólica, hipopotasemia y amilasa elevada", "Acidosis láctica e hiperpotasemia", "Hipernatremia e hipercalcemia", "Hipoglucemia y cetoacidosis", "También bradicardia y QTc prolongado.", 2], ["8.4", "Mujer de 22 años de peso normal con atracones nocturnos y vómitos inducidos 2 veces por semana desde hace 4 meses, con lesiones en los nudillos. ¿Qué cuadro tiene?", "Bulimia nerviosa", "Anorexia restrictiva", "Trastorno por atracón", "Trastorno de rumiación", "El signo de Russell indica vómito autoinducido. Atracón + compensación ≥ 1 vez por semana por 3 meses.", 1], ["8.5", "¿Cuáles son las señales de alarma de gravedad en un TCA?", "Bradicardia, K⁺ bajo, QTc > 500 ms, peso < 75%, ideación suicida", "IMC normal con vómitos esporádicos y sin otros hallazgos", "Amenorrea de un mes como único hallazgo clínico", "Cualquier restricción leve sin signos de gravedad", "Los 3 ejes: nutricional, médico y psiquiátrico.", 2], ["8.5", "¿Qué IMC se asocia a cada nivel de atención en anorexia?", "Ambulatorio ~16-18; hospital de día 14,5-16; internación < 14", "Ambulatorio < 14; hospital de día 16-18; internación > 18", "Ambulatorio 14,5-16; hospital de día < 14; internación 16-18", "Los tres niveles con IMC < 14", "Hospital de día también: falla ambulatoria, transición desde internación, necesidad de asistencia para comer, conductas impulsivas, familias poco continentes.", 2], ["8.5", "¿Cuándo es adecuado el tratamiento ambulatorio de una bulimia?", "Atracones ≤ 3 por semana, sin purga", "Con purgas frecuentes y diarias", "Con IMC < 14 y complicaciones clínicas", "Con ideación suicida con planificación", "Con purga se desaconseja el ambulatorio. Atracón y no especificados son tratables ambulatoriamente si no hay comorbilidad importante.", 1], ["8.5", "¿Qué es el síndrome de realimentación y cómo se previene?", "Complicación de realimentar rápido a un desnutrido", "Aumento excesivo de peso tras el alta", "Retención de líquidos por suspender diuréticos", "Una forma de bulimia con atracones", "Es una complicación grave de la realimentación.", 2], ["8.5", "¿Cuáles son los tres ejes para evaluar la gravedad de un TCA?", "Nutricional, médico y psiquiátrico", "Físico, social y laboral", "Familiar, escolar y médico", "Peso, talla y edad", "Nutricional: peso, velocidad de la pérdida, ingesta.", 2], ["8.5", "¿Para qué cuadro se recomienda el hospital de día?", "Falla ambulatoria o necesidad de ayuda para comer", "IMC mayor a 18 con buena adherencia", "Un único atracón sin compensación", "Solo ideación suicida con plan", "También como transición desde una internación (IMC 14,5-16 con parámetros estables).", 1], ["8.5", "¿Cuál de estas situaciones indica internación?", "IMC < 14 o negativa a alimentarse", "IMC 17 con buen apoyo familiar", "Un episodio aislado de atracón", "Amenorrea de un mes", "También complicaciones clínicas graves.", 1], ["8.5", "¿Cuál es el criterio de tratamiento ambulatorio de la anorexia?", "IMC ~16-18 sin complicaciones y con deseo de colaborar", "IMC < 14 con internación previa", "Comorbilidades graves no controladas", "Familia poco continente", "Se arma un encuadre (controles nutricional, psicológico, clínico, TO y psiquiatría) con acuerdo del paciente.", 1], ["8.5", "Mujer con anorexia, IMC 13,5, que se niega a alimentarse. ¿Qué nivel de atención corresponde?", "Internación", "Ambulatorio con controles semanales", "Hospital de día", "Solo seguimiento nutricional", "IMC < 14, negativa a alimentarse o ideación grave son criterios de internación.", 2], ["8.5", "Paciente muy desnutrida que lleva tiempo sin comer. ¿Qué cuidado requiere la realimentación?", "Progresiva y lenta, por el riesgo de síndrome de realimentación", "Rápida, para recuperar peso cuanto antes", "Sin necesidad de control cardíaco", "Con dosis altas de glucosa desde el inicio", "Puede producir insuficiencia cardíaca, arritmias y falla respiratoria.", 1], ["8.6", "Trastorno por atracón: ¿cuál es la característica diferencial?", "Atracones sin compensación", "Atracones seguidos de vómito autoinducido", "Restricción sostenida con peso bajo", "Regurgitación y nueva masticación del alimento", "Come más rápido, hasta sentirse incómodamente lleno, sin hambre y a solas por vergüenza.", 1], ["8.6", "Ingesta de sustancias no nutritivas durante al menos 1 mes, no cultural ni explicada por otro trastorno, es:", "Pica", "Rumiación", "OSFED", "Trastorno por atracón", "Rumiación: regurgitación del alimento (lo mastica de nuevo o lo escupe). OSFED/UFED: cuadros que no alcanzan la frecuencia o el tiempo exigidos.", 2], ["8.6", "¿Cómo es la ingesta en el trastorno por atracón?", "Más que la mayoría en ~2 horas, rápido y a solas", "Pequeña y lenta, con restricción", "Seguida de vómito autoinducido", "Solo en público y con placer", "Se acompaña de disgusto o tristeza.", 2], ["8.6", "¿Con qué se asocia el trastorno por atracón?", "Sobrepeso, inicio más tardío, depresión y ansiedad", "Peso muy bajo y amenorrea", "Inicio en la infancia temprana", "Mejoría con la restricción", "A diferencia de la anorexia, el paciente sufre su síntoma (egodistónico).", 2], ["8.6", "¿Qué es el trastorno de rumiación?", "Regurgitar el alimento y masticarlo o escupirlo", "Ingerir sustancias no nutritivas", "Hacer atracones sin compensar", "Restringir por temor a engordar", "Pica: ingesta de sustancias no nutritivas ≥ 1 mes.", 2], ["8.6", "¿Qué son los cuadros OSFED/UFED?", "Cuadros en evolución que no alcanzan frecuencia o tiempo exigidos", "Cuadros con criterios completos de anorexia", "Trastornos del neurodesarrollo", "Efectos adversos de fármacos", "Por ejemplo, una bulimia en la que no se cumple la frecuencia.", 2], ["8.6", "Mujer de 35 años con obesidad y atracones semanales sin ninguna conducta compensatoria, con vergüenza y tristeza. ¿Qué cuadro tiene?", "Trastorno por atracón", "Bulimia nerviosa", "Anorexia purgativa", "Pica", "Es egodistónico y se asocia a sobrepeso, depresión y ansiedad.", 1], ["8.7", "En el caso de la paciente de 26 años con anorexia purgativa y trastorno límite, ¿por qué se la pesaba sin que viera el número?", "Para no reforzar el control del peso ni los diuréticos", "Para evitar que se deprimiera", "Porque rechazaba el examen físico", "Por indicación expresa de la familia", "Ingresó con IMC 19,2, creía haber engordado 10 kg y rechazaba pesarse.", 1], ["8.7", "En ese caso, ¿qué se hizo cuando la risperidona causó galactorrea?", "Se rotó a aripiprazol", "Se suspendió todo antipsicótico", "Se subió la dosis de risperidona", "Se indicó clozapina con control de leucocitos", "Al rotar, volvió a los diuréticos con hipopotasemia e ideación autolítica → internación.", 2], ["8.7", "¿Cómo fue la secuencia de conductas de la paciente de 26 años?", "Restricción a los 15, laxantes a los 16 y diuréticos a los 17", "Diuréticos a los 15 y laxantes a los 20", "Atracones a los 15 y vómito a los 17", "Restricción a los 20 y laxantes a los 26", "A los 19 hizo un intento autolítico con 110 comprimidos de diurético y a los 23 una sobreingesta de alprazolam.", 3], ["8.7", "¿Qué se hizo con la medicación porque no la tomaba por miedo a engordar?", "Se la observaba y hasta se dio molida", "Se suspendió definitivamente", "Se indicó por vía endovenosa siempre", "Se delegó en la familia", "Entregaba los diuréticos a los profesionales (se interpretó como una actuación o transferencia).", 2], ["8.7", "¿Con qué fármacos se trató a la paciente?", "Sertralina, risperidona, aripiprazol y zuclopentixol de depósito", "Litio y valproato", "Metilfenidato y atomoxetina", "Solo benzodiazepinas", "Consultaba por síncopes o mareos semanales; el tratamiento duró ~5 años.", 1], ["8.7", "¿Por qué se explica la asociación entre este TCA y el trastorno límite?", "No tienen representación mental de su propio cuerpo", "Ambos son trastornos del neurodesarrollo", "Ambos son formas de psicosis", "El TCA causa el trastorno límite", "Frase de la paciente: «yo sé que lo percibo mal, pero me siento obesa».", 2], ["9.1", "¿Qué edad se toma en psiquiatría (DSM) como punto de corte para hablar de una personalidad desarrollada?", "18 años", "12 años", "25 años", "30 años", "La personalidad se gesta en el encuentro entre lo heredado y lo adquirido y se consolida al terminar la adolescencia.", 3], ["9.1", "¿Cómo se define una personalidad bien desarrollada?", "Patrón estable y coherente, predecible y plástico", "Rígida e invariable ante cualquier situación", "Impredecible pero adaptable", "Determinada exclusivamente por la herencia", "Etimología: persona (del latín personare, «sonar») evoca la máscara de los actores griegos.", 2], ["9.1", "¿Cuáles son los años críticos para la personalidad según el autor?", "Los primeros años de vida (2, 3 o 5 años)", "La adolescencia tardía", "La edad adulta", "Los años escolares", "El infante nace desprotegido: necesita quien cumpla la función materna o de cuidado.", 3], ["9.1", "¿Qué teorías se vinculan con la formación de la personalidad en la clase?", "Apego, separación-individuación, madre suficientemente buena y relaciones objetales", "Solo el conductismo clásico", "Solo la herencia genética", "Solo la teoría cognitiva", "La personalidad es heredera del modo de cuidado recibido, que se internaliza.", 2], ["9.1", "¿Qué evoca la etimología de «persona» (personare, sonar)?", "La máscara de los actores griegos", "Un nombre propio", "Un rol social", "Un tipo de voz", "Puede ser una máscara que expresa a la persona o una cáscara puesta sobre la propia cara.", 3], ["9.2", "Diferencia entre temperamento y carácter:", "Temperamento: innato", "Temperamento: adquirido; carácter: innato", "Ambos son exclusivamente adquiridos", "Ambos son exclusivamente genéticos", "El temperamento son las primeras posibilidades de reacción (intensidad, ritmo, umbrales). El carácter se forja desde los primeros contactos madre-hijo.", 1], ["9.2", "Las cuatro dimensiones del temperamento de Cloninger (1993) son:", "Búsqueda de novedad, evitación del daño, dependencia de la recompensa y persistencia", "Introversión, neuroticismo, psicoticismo y apertura", "Impulsividad, ansiedad, apego y agresión", "Control, afecto, cognición y conducta", "El apunte aclara que los sistemas de neurotransmisores asociados se citaron de forma poco clara en el audio y conviene confirmarlos en la bibliografía.", 3], ["9.2", "¿Qué significa que la madre es «suficientemente buena» (Winnicott)?", "Da lo que puede y frustra en dosis adecuadas", "Nunca frustra al bebé", "Satisface todas sus demandas de inmediato", "Es siempre la madre biológica", "El gesto genuino del bebé debe recibir respuesta, aunque no siempre se lo descifre. No necesariamente es la madre: sirve para familias monoparentales, ensambladas, etc.", 2], ["9.2", "Para forjar un buen carácter, la función de cuidado debe permitir:", "Sostener (holding) y permitir pasar a la independencia", "Satisfacer solo las necesidades fisiológicas", "Evitar toda frustración posible", "Mantener la dependencia absoluta del bebé", "Si el cuidador «se lo fagocita» es fuente de problemas. La constancia objetal es internalizar al otro aunque no esté presente e integrar aspectos buenos y malos.", 2], ["9.2", "¿Cómo responde el bebé según el temperamento?", "Pura pulsión: descarga motora según placer o displacer", "Con lenguaje elaborado y simbólico", "Con control de los impulsos", "Con juicio moral formado", "Si hay agresión innata pero un medio amoroso, se domina.", 2], ["9.2", "¿Qué relación hay entre autorregulación e impulsividad?", "Inversa: más autorregulación, menos impulsividad", "Directa: más autorregulación, más impulsividad", "No hay ninguna relación entre ambas", "La impulsividad causa la autorregulación", "Lo vivido en los primeros años deja vías facilitadas («una autopista») que cuesta cambiar con terapia.", 2], ["9.2", "¿Qué es la constancia objetal?", "Internalizar al otro aunque no esté presente", "Depender del otro para funcionar", "Idealizar al cuidador", "Negar la ausencia del otro", "Incluye introyecciones e identificaciones.", 2], ["9.3", "Según el apunte, la personalidad es la suma de:", "Temperamento, carácter, valores del superyó y cognición", "Solo temperamento y carácter", "Carácter y conciencia moral", "Genética e inteligencia", "Implica apego seguro, separación-individuación lograda, constancia objetal, identidad integrada (precondición de la autoestima), defensas maduras, prueba de realidad conservada y plasticidad.", 2], ["9.3", "¿Qué implica la personalidad normal?", "Apego seguro, identidad integrada y defensas maduras", "Defensas primitivas", "Difusión de identidad", "Prueba de realidad abolida", "También: controlar impulsos, tolerar la ansiedad y sublimar.", 2], ["9.4", "¿Cuál es la epidemiología de la organización límite?", "2-3% de la población y ~25% de los internados", "20% de la población general y 5% de los internados", "0,2% de la población y 2% de los internados", "10% de la población y 50% de los internados", "Origen: ausencia de sostén en los primeros años (abandono, negligencia, agresión, violencia o abuso).", 3], ["9.4", "¿Qué ocurre con la prueba de realidad en la organización límite?", "Se conserva, con pérdida transitoria bajo estrés y crítica posterior", "Está abolida de forma permanente, como en la psicosis", "Siempre está intacta, incluso bajo estrés intenso", "No se evalúa en esta organización", "Es la diferencia con la psicosis (prueba de realidad abolida).", 2], ["9.4", "Un paciente se siente perseguido por estrés laboral, se interna y con medicación se compensa en < 30 días, diciendo «sé que era una locura, me da vergüenza». ¿Qué sugiere?", "Episodio psicótico breve en organización límite", "Esquizofrenia paranoide de inicio agudo", "Trastorno delirante crónico persecutorio", "Delirium con alucinaciones visuales", "En la psicosis no hay crítica: «ahora no me quieren envenenar, pero en ese momento sí me parecía». Hay que ver el curso longitudinal: un tóxico, un tumor o una epilepsia temporal también dan delirio.", 1], ["9.4", "Organización vs trastorno de personalidad:", "Todo trastorno de personalidad tiene organización límite, no al revés", "Todo borderline tiene un trastorno de personalidad", "Son sinónimos y se usan indistintamente", "El trastorno es la estructura y la organización la descompensación", "La organización es la estructura (defensas, identidad, prueba de realidad) y siempre está; el trastorno aparece cuando el paciente se descompensa y cumple criterios. Los síntomas suelen ser egosintónicos («yo soy así»).", 1], ["9.4", "¿Qué plantean los posfreudianos sobre la organización límite?", "Una tercera estructura, junto a neurosis y psicosis", "Una variante más leve de la neurosis", "Una variante más leve de la psicosis", "Una categoría que no existe como estructura", "Estable y apuntalado funciona «como neurótico»; desregulado puede funcionar «como psicótico», con restitución total.", 2], ["9.4", "¿Cuáles son las defensas de la organización límite?", "Escisión, idealización/desvalorización y omnipotencia", "Represión y formación reactiva", "Sublimación, altruismo y humor", "Intelectualización y anulación", "Son defensas primitivas: no se integran los aspectos buenos y malos.", 2], ["9.4", "¿Cómo es la identidad en la organización límite?", "Difusión de identidad y superyó abolido", "Identidad integrada y estable", "Identidad rígida y poco plástica", "Identidad idealizada y coherente", "Valores éticos, creencias y orientación sexual cambiantes.", 2], ["9.4", "¿Cómo se viven los síntomas de la organización límite?", "Egosintónicos: «yo soy así», el problema son los otros", "Con malestar y pedido espontáneo de ayuda", "Con plena conciencia de enfermedad", "Como un cuerpo extraño para el yo", "Es lo contrario a la neurosis, que es egodistónica.", 2], ["9.4", "Paciente que, por estrés laboral, se siente perseguida y se interna; con medicación se compensa en menos de 30 días y dice «sé que era una locura». ¿Qué sugiere?", "Episodio psicótico breve en organización límite", "Esquizofrenia paranoide de inicio agudo", "Trastorno delirante persecutorio crónico", "Delirium de causa orgánica", "Hay restitución total y crítica; en la psicosis no hay crítica.", 1], ["9.5", "¿Qué se pide en el criterio de impulsividad del trastorno límite?", "Al menos 2 áreas potencialmente autodestructivas", "Una sola área de impulsividad", "Solo impulsividad sexual", "Impulsividad con autolesión obligatoria", "Falacia: no todos los pacientes con organización límite se cortan.", 2], ["9.5", "Sentimiento crónico de vacío («tengo todo, pero me siento vacío»), ira intensa y esfuerzos frenéticos por evitar el abandono, ¿qué reflejan?", "Falta de internalización de un otro y de constancia objetal", "Un cuadro bipolar con episodio mixto", "Una psicosis esquizofrénica incipiente", "Un delirio sistematizado de tipo somático", "Las ideas paranoides transitorias o los síntomas disociativos en el límite son relacionados con el estrés; el juicio está desviado por las emociones y no por los pensamientos o las alteraciones sensoperceptivas como en la psicosis.", 2], ["9.5", "¿Cuál es la falacia sobre el trastorno límite?", "Que todos los pacientes límite se cortan", "Que pueden tener ideas paranoides transitorias", "Que son impulsivos en varias áreas", "Que sienten un vacío crónico", "El criterio es conducta suicida recurrente o automutilación, pero no todos se cortan.", 2], ["9.5", "Las ideas paranoides transitorias o síntomas disociativos relacionados con el estrés en el límite se diferencian de la psicosis porque:", "El juicio se desvía por las emociones, no por pensamientos", "Duran toda la vida del paciente", "No guardan relación con el estrés", "Se organizan en un delirio sistematizado", "Los criterios no están siempre todos presentes; regulado, el paciente puede no cumplir el trastorno aunque mantenga la organización.", 1], ["9.5", "Mujer de 24 años con relaciones intensas que alternan idealización y devaluación, pánico al abandono, vacío crónico e impulsividad. ¿Qué trastorno tiene?", "Trastorno límite de la personalidad", "Trastorno bipolar tipo 2", "Trastorno histriónico de la personalidad", "Esquizofrenia de inicio juvenil", "Hay difusión de identidad, escisión e identificación proyectiva.", 1], ["9.6", "¿Qué trastornos forman el cluster A (más cerca de la psicosis)?", "Paranoide, esquizoide y esquizotípico", "Límite, narcisista, antisocial e histriónico", "Obsesivo-compulsivo, dependiente y evitativo", "Límite, dependiente y evitativo", "Hay 10 trastornos de personalidad. Según la tabla del apunte: cluster B = límite, narcisista, antisocial; cluster C = histriónico, obsesivo-compulsivo, dependiente y evitativo (nota: en el DSM-5 estándar el histriónico se ubica en el cluster B).", 2], ["9.6", "El trastorno esquizotípico se caracteriza por:", "Conductas y vestimenta bizarras", "Aislamiento y ausencia de necesidad de los demás", "Suspicacia y desconfianza hacia los otros", "Dependencia infantil absoluta de otra persona", "Esquizoide: solitarios, poco empáticos, no necesitan a los otros. Paranoide: suspicaces, no consolidan un delirio y tienen crítica.", 2], ["9.6", "¿Cómo se diferencia el trastorno histriónico del narcisista?", "Histriónico: busca ser validado", "Histriónico: se cree superior; narcisista: busca validación", "Ambos se creen superiores y no necesitan validación", "Son cuadros idénticos con distinto nombre", "El narcisista tiene relaciones utilitarias, devalúa y descarta a quien no lo pone en ese lugar, y no empatiza.", 1], ["9.6", "El trastorno obsesivo-compulsivo de la personalidad se diferencia del TOC porque tiene:", "Solo obsesiones, sin compulsiones", "Obsesiones y compulsiones graves", "Compulsiones sin obsesiones previas", "Delirios sistematizados de contenido obsesivo", "Antisocial: carece de empatía, vínculos utilitarios, delitos y manipulación; se deprime cuando no hay a quién manipular. Dependiente: dependencia infantil absoluta. Evitativo: evita situaciones estresantes con defensas primitivas.", 1], ["9.6", "Analogía de los clusters: ¿qué son los trastornos de personalidad respecto del «país límite»?", "Las provincias del país límite", "Países vecinos del país límite", "Capitales de cada estructura", "Fronteras entre estructuras", "Los tres «países» son la psicosis, la neurosis y la organización límite.", 2], ["9.6", "¿Cómo es el trastorno paranoide de la personalidad?", "Suspicaz, sin delirio y con crítica", "Solitario y poco empático", "Conductas y vestimenta bizarras", "Dependencia infantil absoluta", "Pertenece al cluster A.", 1], ["9.6", "¿Qué caracteriza al trastorno esquizoide?", "Aislado, poco empático", "Desconfianza persistente hacia los demás", "Vestimenta y conductas extravagantes", "Grandilocuencia y búsqueda de admiración", "Es del cluster A.", 2], ["9.6", "¿Cómo se manifiesta el trastorno narcisista?", "Grandilocuente, utilitario y sin empatía", "Dependencia total del otro", "Evitación social por temor", "Necesidad de validación para sentirse seguro", "Se cree y se sabe superior.", 2], ["9.6", "¿Qué caracteriza al trastorno antisocial?", "Sin empatía ni normas internalizadas", "Dependencia absoluta de otra persona", "Evitación de toda situación estresante", "Desconfianza generalizada hacia todos", "Sus vínculos son utilitarios.", 2], ["9.6", "¿Cómo es el trastorno dependiente?", "Dependencia infantil absoluta de otro", "Aislamiento voluntario", "Búsqueda teatral de atención", "Perfeccionismo extremo", "Evitativo: evita situaciones estresantes con defensas primitivas (descalificación).", 2], ["9.6", "¿Con qué trastornos alinea la organización límite un autor citado en clase?", "Sobre todo con el histriónico y el narcisista", "Con el esquizoide y el paranoide", "Con el dependiente y el evitativo", "Con el obsesivo-compulsivo", "La clase usa la organización límite como referencia común a los 10 tipos.", 3], ["9.6", "Paciente con un patrón estable de desconfianza hacia los demás, pero sin certeza delirante y con crítica. ¿Qué cuadro tiene?", "Trastorno paranoide de la personalidad", "Trastorno delirante persecutorio", "Esquizofrenia paranoide", "Trastorno esquizotípico", "Pertenece al cluster A, más cercano a la psicosis, pero con juicio conservado.", 1], ["9.6", "Persona grandilocuente, que se cree superior, con vínculos utilitarios y sin empatía; descarta a quien no la ratifica. ¿Qué trastorno tiene?", "Narcisista", "Histriónico", "Dependiente", "Evitativo", "El histriónico necesita llamar la atención y ser validado para sentirse seguro.", 1], ["9.7", "¿Cuáles son las 4 psicoterapias validadas para el trastorno límite?", "Focalizada en transferencia, TCC, mentalización y dialéctico-conductual", "Psicoanálisis clásico, gestalt, sistémica y humanista", "Solo terapia cognitivo-conductual y psicoanálisis", "Hipnosis, psicodrama, gestalt y conductismo", "La psicoterapia es lo principal.", 2], ["9.7", "Farmacoterapia del trastorno límite:", "Sintomática según el cuadro", "Litio de por vida como estabilizador", "Clozapina como primera línea", "Antidepresivos sostenidos de por vida", "Es farmacología sintomática.", 2], ["10.1", "¿Cuáles son los peldaños de gravedad del suicidio?", "Idea de muerte → ideación suicida → planificación", "Planificación → idea de muerte → intento", "Acting → pasaje al acto → intento", "Intento → ideación suicida → idea de muerte", "La idea de suicidio se considera siempre patológica. Siempre hay que preguntar: preguntar no lo induce y si no se pregunta no se sabe.", 2], ["10.1", "¿Cómo se define el suicidio?", "Terminar con la propia vida de forma voluntaria y consciente", "Un accidente con resultado de muerte", "Una conducta impulsiva sin intención alguna", "Una enfermedad psiquiátrica específica", "Se distinguen intentos fallidos y consumados. La idea de suicidio es siempre patológica.", 2], ["10.1", "¿Por qué hay que preguntar siempre por el suicidio?", "Preguntar no lo induce y si no se pregunta no se sabe", "Porque la ley obliga a preguntarlo siempre", "Porque preguntarlo lo induce a mejorar", "Porque preguntarlo lo previene automáticamente", "La planificación es el peldaño más grave.", 2], ["10.1", "Paciente que dice «me gustaría dormirme y no despertar más». ¿Cuál es la conducta?", "Preguntar por ideación y planificación: preguntar no lo induce", "No preguntar para no inducirlo", "Indicar el alta con un control al mes", "Minimizar: es una frase sin riesgo", "Es idea de muerte pasiva; el peldaño más grave es la planificación.", 1], ["10.2", "Sobre la epidemiología del suicidio:", "Intentos: más mujeres (~9 a 1)", "Intentos: más hombres; consumados: más mujeres", "Intentos y consumados: sin diferencias por sexo", "Intentos y consumados: más mujeres por igual", "Los hombres usan ahorcamiento o arma de fuego.", 3], ["10.2", "¿Es cierto que «quien lo dice no lo hace»?", "Falso: un tercio consultó el mes anterior o pidió ayuda", "Verdadero en todos los casos", "Verdade nal aguda para el SNC: una insuficiencia encefálica aguda. Es la manifestación final de miles de causas posibles, en general orgánicas.", 2], ["11.1", "«Si en la interconsulta lo veo bien, lo descarto.» ¿Por qué es un error en el delirium?", "Porque fluctúa: hay que volver a verlo", "Porque siempre se presenta igual de mal", "Porque es un cuadro progresivo", "Porque la atención está siempre normal", "El estado cambia durante el día.", 2], ["11.1", "Criterios del CAM (Confusion Assessment Method):", "Agudo/fluctuante, atención y desorganización o conciencia alterada", "Solo alteración de la atención", "Los cuatro criterios siempre", "Alucinaciones y delirios", "No hace falta memorizarla en detalle.", 1], ["11.1", "¿Qué analogía se hace para el delirium?", "Insuficiencia encefálica aguda, como la IRA renal", "Un tumor cerebral oculto", "Una demencia de curso progresivo", "Un ACV isquémico extenso", "Es la manifestación final de miles de causas posibles, en general orgánicas.", 2], ["11.1", "¿En qué pacientes es más frecuente el delirium?", "Ancianos hospitalizados", "Solo en niños pequeños", "Solo en adultos jóvenes sanos", "Solo en pacientes psiquiátricos", "Se instala en días o incluso en horas.", 1], ["11.2", "¿Cuál es el síntoma central del delirium?", "La atención alterada", "La memoria remota", "Las alucinaciones auditivas", "El ánimo elevado", "Otros: desorientación parcial en tiempo (lo más común), pensamiento disgregado, fallas de memoria y lenguaje (puede simular un ACV; por ejemplo, una hiponatremia).", 2], ["11.2", "¿Qué tipo de alucinaciones predomina en el delirium y cuál en la esquizofrenia?", "Delirium: visuales y táctiles", "Delirium: auditivas; esquizofrenia: visuales", "Ambos cuadros: visuales", "Ambos cuadros: auditivas", "En abstinencia alcohólica: microzoopsias («bichitos»). Ilusión: percepción distorsionada de un objeto real; alucinación: percepción sin objeto.", 2], ["11.2", "¿Por qué los ancianos pueden presentar solo el síndrome confusional s s, SNC", "Solo meningitis", "Solo neumonía", "Ninguna infección", "Reglas mnemotécnicas como I WATCH DEATH.", 2], ["11.4", "¿Qué enseñanza deja el caso del paciente psiquiátrico con una úlcera infectada en el pie?", "También tienen causas orgánicas: hay que revisarlos", "No hace falta revisarlos si ya tienen diagnóstico", "La excitación siempre es de causa psiquiátrica", "La úlcera del pie era irrelevante", "Estaba desorientado y atáxico.", 1], ["11.5", "¿Qué se pide siempre como estudios básicos ante un delirium?", "Hemograma, ionograma, función renal, glucemia y orina", "Solo una tomografía de cerebro sin contraste", "Solo un electrocardiograma y radiografía de tórax", "Una resonancia con contraste en todos los casos", "Según la sospecha: radiografía de tórax, ECG y gases arteriales. El síndrome se diagnostica por clínica; la causa se busca con estudios.", 2], ["11.6", "¿Cuál es la diferencia de instalación entre delirium y esquizofrenia?", "Delirium: aguda y fluctuante", "Delirium: subaguda; esquizofrenia: aguda", "Ambos son agudos y fluctuantes", "Ambos son crónicos y estables", "Ante una psicosis aguda en jóvenes, primero se descartan causas orgánicas (ej. encefalitis); la psicosis breve primaria es un diagnóstico de descarte.", 1], ["11.6", "¿Cómo son las alucinaciones en la esquizofrenia comparadas con el delirium?", "Auditivas; en el delirium, visuales y táctiles", "Visuales y táctiles; en el delirium, auditivas", "Gustativas, en ambos cuadros", "Olfatorias, en ambos cuadros", "El esquizofrénico suele estar lúcido, orientado y atento; hay antecedentes psiquiátricos.", 2], ["11.6", "¿Cómo es el diagnóstico de una psicosis breve primaria?", "De descarte: antes se excluyen causas orgánicas", "Se hace primero, sin estudios previos", "No existe como diagnóstico", "Se confirma con una imagen cerebral", "Existen psicosis breves primarias (reactivas).", 1], ["11.6", "Anciano de 78 años con infección urinaria, agitado, desorientado en tiempo y con alucinaciones visua const $=id=>document.getElementById(id);
function show(id){["home","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* tema */
(function(){
  let t=null;try{t=localStorage.getItem(KEY+"_theme")}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  $("theme").onclick=()=>{
    const dark=document.documentElement.getAttribute("data-theme")==="dark"||(!document.documentElement.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    const n=dark?"light":"dark";document.documentElement.setAttribute("data-theme",n);
    try{localStorage.setItem(KEY+"_theme",n)}catch(e){}
  };
})();

/* inicio */
const sel=new Set(Object.keys(TOPICS).map(Number));
function stats(t){const qs=BANK.filter(b=>b.topic===t&&(prio()==="all"||(prio()==="core"&&b.pr<=2)||(prio()==="top"&&b.pr===1)));let r=0,a=0;qs.forEach(b=>{if(getRes(b)!==undefined){a++;if(getRes(b)===1)r++}});return{n:qs.length,a,r}}
function mode(){return document.querySelector('input[name=mode]:checked').value}
function prio(){return document.querySelector('input[name=prio]:checked').value}
function pool(){
  const m=mode(),p=prio();
  return BANK.filter(b=>sel.has(b.topic)&&(p==="all"||(p==="core"&&b.pr<=2)||(p==="top"&&b.pr===1))&&(m==="all"||(m==="todo"&&getRes(b)===undefined)||(m==="wrong"&&getRes(b)===0)));
}
function renderHome(){
  const box=$("topics");box.innerHTML="";
  Object.keys(TOPICS).forEach(k=>{
    k=Number(k);const s=stats(k);
    const l=document.createElement("label");l.className="topic"+(sel.has(k)?" on":"");
    l.innerHTML='<input type="checkbox" '+(sel.has(k)?"checked":"")+'><span><b>'+k+'. '+TOPICS[k]+'</b><small>'+s.n+' preguntas'+(s.a?' · '+s.r+'/'+s.a+' correctas':'')+'</small></span>';
    l.querySelector("input").onchange=e=>{e.target.checked?sel.add(k):sel.delete(k);renderHome()};
    box.appendChild(l);
  });
  const n=pool().length;$("sel").textContent=n+" preguntas seleccionadas";$("start").disabled=n===0;
}
$("allOn").onclick=()=>{Object.keys(TOPICS).forEach(k=>sel.add(Number(k)));renderHome()};
$("allOff").onclick=()=>{sel.clear();renderHome()};
document.querySelectorAll("input[name=mode],input[name=prio]").forEach(r=>r.onchange=renderHome);
$("reset").onclick=()=>{if(confirm("¿Borrar todo el progreso guardado?")){store={v:2,reset:Date.now(),res:{}};save();renderHome()}};

/* sesion */
let S=null;
function begin(list){
  S={list:$("shuf").checked?shuffle(list):list.slice(),i:0,ok:0,done:0,wrongIds:[],byTopic:{}};
  show("quiz");ask();
}
$("start").onclick=()=>begin(pool());
function ask(){
  const b=S.list[S.i];S.cur={b,opts:shuffle(b.opts.map((t,j)=>({t,ok:j===0}))),answered:false};
  $("pos").textContent="Pregunta "+(S.i+1)+" de "+S.list.length;
  $("topicName").textContent=b.topic+". "+TOPICS[b.topic];
  $("prog").style.width=(S.i/S.list.length*100)+"%";
  $("liveScore").textContent=S.done?S.ok+" de "+S.done+" correctas":"";
  $("tag").textContent=["","Esencial","Importante","Detalle"][b.pr]+" · sección "+b.sec.replace(/\.0$/,"");
  $("qtext").textContent=b.q;
  const c=$("choices");c.innerHTML="";
  S.cur.opts.forEach((o,j)=>{
    const btn=document.createElement("button");btn.className="choice";
    btn.innerHTML='<span class="k">'+"ABCD"[j]+'</span><span></span>';
    btn.lastChild.textContent=o.t;btn.onclick=()=>pick(j);c.appendChild(btn);
  });
  $("fb").classList.add("hide");$("next").classList.add("hide");
}
function pick(j){
  const cur=S.cur;if(cur.answered)return;cur.answered=true;
  const good=cur.opts[j].ok;S.done++;if(good)S.ok++;
  const t=cur.b.topic;S.byTopic[t]=S.byTopic[t]||{r:0,n:0};S.byTopic[t].n++;if(good)S.byTopic[t].r++;
  if(!good)S.wrongIds.push(cur.b.id);
  store.res[cur.b.h]=[good?1:0,Date.now()];save();
  [...$("choices").children].forEach((btn,k)=>{
    btn.disabled=true;
    if(cur.opts[k].ok)btn.classList.add("ok");
    else if(k===j)btn.classList.add("bad");
    else btn.classList.add("dim");
  });
  const fb=$("fb");fb.className="feedback "+(good?"ok":"bad");
  const right=cur.opts.findIndex(o=>o.ok);
  fb.innerHTML="";
  const h=document.createElement("h3");h.textContent=good?"✔ Correcto":"✘ Incorrecto — la respuesta correcta es "+"ABCD"[right];
  const p=document.createElement("p");p.textContent=cur.b.exp;
  const s=document.createElement("p");s.className="src";s.textContent="Sección "+cur.b.sec.replace(/\.0$/,"")+" del apunte";
  fb.append(h,p,s);
  $("liveScore").textContent=S.ok+" de "+S.done+" correctas";
  $("next").textContent=S.i+1<S.list.length?"Siguiente →":"Ver resultado";
  $("next").classList.remove("hide");$("next").focus();
}
$("next").onclick=()=>{
  if(S.i+1<S.list.length){S.i++;ask()}else finish();
};
$("quit").onclick=()=>{if(S.done===0||confirm("¿Salir de la sesión? Lo respondido queda guardado."))goHome()};
function goHome(){renderHome();show("home")}
$("home2").onclick=goHome;
function finish(){
  show("result");
  const pct=Math.round(S.ok/S.list.length*100);
  $("rScore").textContent=S.ok+" / "+S.list.length+"  ("+pct+"%)";
  $("rMsg").textContent=S.wrongIds.length?"Erraste "+S.wrongIds.length+". Podés repetir solo esas.":"¡Sin errores en esta sesión!";
  const box=$("rTopics");box.innerHTML="";
  Object.keys(S.byTopic).sort((a,b)=>a-b).forEach(k=>{
    const v=S.byTopic[k];const d=document.createElement("div");d.className="tb";
    d.innerHTML='<span></span><span></span><div class="bar"><i></i></div>';
    d.children[0].textContent=k+". "+TOPICS[k];d.children[1].textContent=v.r+"/"+v.n;
    d.querySelector("i").style.width=(v.r/v.n*100)+"%";box.appendChild(d);
  });
  $("redo").classList.toggle("hide",!S.wrongIds.length);
}
$("redo").onclick=()=>begin(BANK.filter(b=>S.wrongIds.includes(b.id)));

document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();let j=-1;
  if("abcd".includes(k)&&k.length===1)j="abcd".indexOf(k);
  else if("1234".includes(k)&&k.length===1)j=Number(k)-1;
  if(j>=0&&!S.cur.answered){pick(j);e.preventDefault()}
  else if(e.key==="Enter"&&S.cur.answered&&document.activeElement!==$("next")){$("next").click();e.preventDefault()}
});
renderHome();
sync();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
</script>
</body>
</html>
